name: Glacier verified macOS 0.20.34 and Android 0.2.9 immutable release
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/glacier-macos-02034-android-029-verified-release.yml'
permissions:
  contents: write
  actions: write
concurrency:
  group: glacier-macos-02034-android-029-immutable-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'zxasd2183-oss/comfyui-director-release' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: 'bb329238124baf096ac5a0bfa08d7527de36b8ae'
      MAC_RUN: '44033772556'
      ANDROID_RUN: '44033772660'
      MAC_TAG: 'glacier-macos-v0.20.34'
      ANDROID_TAG: 'glacier-android-browser-v0.2.9'
      MAC_FILE: 'GlacierBrowser-v0.20.34-macOS-AppleSilicon.dmg'
      ANDROID_FILE: 'GlacierAndroid-v0.2.9-ARM64-x86_64-release.apk'
      GLACIER_ANDROID_CERT_SHA256: '6d8fb8a4b3dd90427ff2f7959394df4b73f37c117a7d1d2e983bde0f10a1ff4e'
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pin exact successful native QA and reject changed platform sources
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          repo=os.environ['GITHUB_REPOSITORY']
          src=os.environ['SOURCE_SHA']
          for title,key,path in (
              ('macOS','MAC_RUN','glacier-macos/'),
              ('Android','ANDROID_RUN','glacier-android-gecko/'),
          ):
              run=os.environ[key]
              doc=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs/{run}']))
              if not (
                  doc.get('head_sha')==src and
                  doc.get('head_branch')=='release/glacier-min8-02034-android029-rc-20261116' and
                  doc.get('status')=='completed' and doc.get('conclusion')=='success' and
                  doc.get('repository',{}).get('full_name')==repo
              ):
                  raise RuntimeError('Original '+title+' successful native QA missing or wrong source')
              subprocess.run(['git','diff','--exit-code',src,'HEAD','--',path],check=True)
              print('PASS original native QA',title,run)
          for path in (
              '.github/workflows/glacier-rc-macos.yml',
              '.github/workflows/glacier-rc-android.yml',
              'scripts/glacier_prepare_rotated_update.py',
              'scripts/glacier_release_version_check.py',
          ):
              subprocess.run(['git','diff','--exit-code',src,'HEAD','--',path],check=True)
          jobs=json.loads(subprocess.check_output(['gh','api',
              f'repos/{repo}/actions/runs/{os.environ["ANDROID_RUN"]}/jobs?per_page=100']))['jobs']
          required=(
              'Check permanent Glacier Android signing configuration',
              'Build GeckoView + embedded sing-box dual-ABI APK',
              'Android 15 SOCKS offline fail-closed regression (no VLESS secrets)',
              'Android 15 SOCKS5 remote-DNS route via synthetic host (no secrets)',
              'Android 15 Keystore saved-node persistence M01',
              'Android 15 x86_64 real-APK UI smoke (bounded ADB + evidence)',
              'Android 15 fresh real-sites + native UI click stress',
              'Build permanent-signature Android RC (artifact ONLY, never publish)',
          )
          for name in required:
              if len([j for j in jobs if j.get('name')==name and j.get('conclusion')=='success'])!=1:
                  raise RuntimeError('Android permanent signer/emulator QA failed: '+name)
          print('PASS all eight Android build, signer and emulator QA gates')
          PY
          python3 scripts/glacier_release_version_check.py
          python3 glacier-android-gecko/scripts/check_rc_version_consistency.py
      - name: Refuse reused release tags and non-monotonic versions including drafts
        run: |
          set -euo pipefail
          for tag in "$MAC_TAG" "$ANDROID_TAG"; do
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
              echo "::error::Tag already used; refusing overwrite"; exit 3
            fi
          done
          python3 - <<'PY'
          import json,os,re,subprocess
          repo=os.environ['GITHUB_REPOSITORY']
          releases=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/releases?per_page=100']))
          requirements=(
              (re.compile(r'glacier-macos-v(\d+)\.(\d+)\.(\d+)'), (0,20,34),os.environ['MAC_TAG']),
              (re.compile(r'glacier-android-browser-v(\d+)\.(\d+)\.(\d+)'), (0,2,9),os.environ['ANDROID_TAG']),
          )
          for regex,approved,tag in requirements:
              for doc in releases:
                  name=doc.get('tag_name')
                  m=regex.fullmatch(name) if isinstance(name,str) else None
                  if m and tuple(map(int,m.groups()))>=approved:
                      raise RuntimeError('Existing or rollback release identity: '+name)
              print('PASS unused strictly-monotonic release identity',tag)
          PY
      - name: Download only original macOS DMG and permanent signed Android APK
        run: |
          set -euo pipefail
          mkdir -p staged/mac staged/android
          gh run download "$MAC_RUN" --repo "$GITHUB_REPOSITORY" \
            --name GlacierBrowser-RC-macOS-AppleSilicon-DMG --dir staged/mac
          gh run download "$ANDROID_RUN" --repo "$GITHUB_REPOSITORY" \
            --name GlacierAndroid-v0.2.9-STABLE-SIGNED-RC-NOT-PUBLISHED --dir staged/android
      - name: Install Android package signature inspection tools
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'build-tools;36.0.0' --channel=3
      - name: Verify full installer SHA256, DMG trailer, Android permanent signing and both native ABIs
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,os,re,subprocess
          from pathlib import Path
          from zipfile import ZipFile
          mac=Path('staged/mac')/os.environ['MAC_FILE']
          apk=Path('staged/android')/os.environ['ANDROID_FILE']
          for parent,file,low,high in (
              (Path('staged/mac'),mac,150_000_000,650_000_000),
              (Path('staged/android'),apk,150_000_000,600_000_000),
          ):
              items=list(parent.iterdir())
              if len(items)!=1 or items[0]!=file or file.is_symlink() or not file.is_file():
                  raise RuntimeError('Unexpected native candidate artifact directory')
              if not low<=file.stat().st_size<=high:
                  raise RuntimeError('Native candidate installer size invalid')
              with file.open('rb') as stream:
                  digest=hashlib.file_digest(stream,'sha256').hexdigest()
              var='MAC' if file==mac else 'ANDROID'
              with open(os.environ['GITHUB_ENV'],'a',encoding='utf8') as out:
                  out.write(var+'_SHA256='+digest+'\n')
                  out.write(var+'_SIZE='+str(file.stat().st_size)+'\n')
              print('PASS original full installer SHA256',file.name,file.stat().st_size,digest,flush=True)
          with mac.open('rb') as src:
              src.seek(-512,2)
              if src.read(4)!=b'koly':
                  raise RuntimeError('Mac DMG UDIF trailer invalid')
          with ZipFile(apk) as z:
              contents=set(z.namelist())
              for abi in ('arm64-v8a','x86_64'):
                  for engine in ('libxul.so','libsingbox.so'):
                      if 'lib/'+abi+'/'+engine not in contents:
                          raise RuntimeError('Native Android engine is missing: '+abi+'/'+engine)
          android_build=Path(os.environ['ANDROID_HOME'])/'build-tools'/'36.0.0'
          signer=str(android_build/'apksigner')
          subprocess.run([signer,'verify','--verbose',str(apk)],check=True)
          cert=subprocess.check_output([signer,'verify','--print-certs',str(apk)],text=True)
          m=re.search(r'Signer #1 certificate SHA-256 digest:\s*([a-fA-F0-9]{64})',cert)
          if not m or m.group(1).lower()!=os.environ['GLACIER_ANDROID_CERT_SHA256']:
              raise RuntimeError('Permanent Android update signer changed')
          package=subprocess.check_output([str(android_build/'aapt'),'dump','badging',str(apk)],text=True).splitlines()[0]
          for item in (
              "name='cn.borealos.glacier.geckopreview'",
              "versionCode='18'",
              "versionName='0.2.9'",
          ):
              if item not in package:
                  raise RuntimeError('Android versionCode/package/versionName mismatch')
          print('PASS original Android permanent signature, monotonic app identity and native libraries')
          PY
      - name: Create two nonpublic immutable draft releases from verified QA artifacts
        run: |
          set -euo pipefail
          gh release create "$MAC_TAG" "staged/mac/$MAC_FILE" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft \
            --title 'Glacier macOS 0.20.34 · 统一账号最低 8 位密码' \
            --notes 'Apple Silicon 统一账号密码最低 8 位。保留独立保险箱主密码至少 12 位、Cookie 和账号端到端加密、VLESS 与设备授权。安装版为 ad-hoc 签名，尚未 Apple Developer ID 公证。自动更新依靠 Ed25519 签名和 SHA256。'
          gh release create "$ANDROID_TAG" "staged/android/$ANDROID_FILE" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft \
            --title 'Glacier Android 0.2.9 · 统一账号最低 8 位密码' \
            --notes 'Android 0.2.9/versionCode 18，统一账号密码最低 8 位。保留永久 APK 签名、Keystore、Cookie 隔离和加密同步。用同一永久签名覆盖安装 0.2.8，不要先卸载。邀请码仅用于首次创建 Glacier 账号，不内置到安装包。'
      - name: Refuse release publication unless both drafts match exact SHA256 and source
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,subprocess
          repo=os.environ['GITHUB_REPOSITORY']
          releases=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/releases?per_page=100']))
          for prefix,tag,file in (
              ('MAC',os.environ['MAC_TAG'],os.environ['MAC_FILE']),
              ('ANDROID',os.environ['ANDROID_TAG'],os.environ['ANDROID_FILE']),
          ):
              matching=[r for r in releases if r.get('tag_name')==tag]
              if len(matching)!=1:raise RuntimeError('Expected exactly one unpublished draft: '+tag)
              doc=matching[0]
              assets=doc.get('assets',[])
              if (doc.get('draft') is not True or doc.get('published_at') is not None
                  or doc.get('prerelease') or doc.get('target_commitish')!=os.environ['GITHUB_SHA']
                  or len(assets)!=1 or assets[0].get('name')!=file or
                  assets[0].get('size')!=int(os.environ[prefix+'_SIZE']) or
                  assets[0].get('state')!='uploaded' or
                  assets[0].get('digest')!='sha256:'+os.environ[prefix+'_SHA256']):
                  raise RuntimeError('Hidden draft or original installable asset mismatch: '+tag)
              with open(os.environ['GITHUB_ENV'],'a',encoding='utf8') as env:
                  env.write(prefix+'_RELEASE_ID='+str(doc['id'])+'\n')
              print('PASS immutable draft release verified',tag,doc['id'],flush=True)
          PY
      - name: Publish both original verified drafts by immutable release ID
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,subprocess
          repo=os.environ['GITHUB_REPOSITORY']
          for prefix in ('ANDROID','MAC'):
              release_id=os.environ[prefix+'_RELEASE_ID']
              tag=os.environ[prefix+'_TAG']
              original=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/releases/{release_id}']))
              if (original.get('tag_name')!=tag or not original.get('draft') or
                  original.get('target_commitish')!=os.environ['GITHUB_SHA'] or
                  len(original.get('assets',[]))!=1):
                  raise RuntimeError('Draft changed since verification')
              patched=json.loads(subprocess.check_output([
                  'gh','api','-X','PATCH',
                  f'repos/{repo}/releases/{release_id}','-F','draft=false']))
              asset=patched.get('assets',[])
              if (patched.get('draft') is not False or
                  patched.get('tag_name')!=tag or not patched.get('published_at') or
                  len(asset)!=1 or
                  asset[0].get('name')!=os.environ[prefix+'_FILE'] or
                  asset[0].get('size')!=int(os.environ[prefix+'_SIZE']) or
                  asset[0].get('digest')!='sha256:'+os.environ[prefix+'_SHA256']):
                  raise RuntimeError('Published release does not match original QA artifact: '+tag)
              print('PASS public immutable verified installer',tag,flush=True)
          PY
      - name: Ask existing owner VPS to mirror official macOS DMG and sign its separate feed
        run: |
          set -euo pipefail
          gh workflow run glacier-preview-immediate.yml --ref main --repo "$GITHUB_REPOSITORY"
          gh workflow run glacier-macos-signed-auto.yml --ref main --repo "$GITHUB_REPOSITORY"
          echo 'macOS/Android original releases published; VPS and independent Ed25519 macOS signing requested, separately verify their completion.' >> "$GITHUB_STEP_SUMMARY"
