name: Glacier Android 0.2.5 immutable verified release
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/glacier-android025-verified-release.yml'
permissions:
  contents: write
  actions: read
concurrency:
  group: glacier-android-v025-one-time
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'zxasd2183-oss/comfyui-director-release' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      QA_RUN: '43810167937'
      BUILD_SHA: 'afd2284d776a9bc106f39596667803e89a6966fc'
      CERT_PIN: '6d8fb8a4b3dd90427ff2f7959394df4b73f37c117a7d1d2e983bde0f10a1ff4e'
      ANDROID_HOME: '/usr/local/lib/android/sdk'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Confirm all eight Android original native QA gates and unchanged code
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,json,subprocess
          repo=os.environ['GITHUB_REPOSITORY']; run=os.environ['QA_RUN']; sha=os.environ['BUILD_SHA']
          r=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs/{run}']))
          if (r.get('status')!='completed' or r.get('conclusion')!='success'
              or r.get('head_branch')!='main' or r.get('head_sha')!=sha
              or r.get('repository',{}).get('full_name')!=repo):
              raise RuntimeError('Original Android v0.2.5 native QA is not green')
          jobs=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs/{run}/jobs?per_page=100']))['jobs']
          required=('Check permanent Glacier Android signing configuration',
            'Build GeckoView + embedded sing-box dual-ABI APK',
            'Android 15 SOCKS offline fail-closed regression (no VLESS secrets)',
            'Android 15 SOCKS5 remote-DNS route via synthetic host (no secrets)',
            'Android 15 Keystore saved-node persistence M01',
            'Android 15 x86_64 real-APK UI smoke (bounded ADB + evidence)',
            'Android 15 fresh real-sites + native UI click stress',
            'Build permanent-signature Android RC (artifact ONLY, never publish)')
          for name in required:
              if len([j for j in jobs if j.get('name')==name and j.get('conclusion')=='success'])!=1:
                  raise RuntimeError('Missing native Android QA: '+name)
          subprocess.run(['git','merge-base','--is-ancestor',sha,'HEAD'],check=True)
          subprocess.run(['git','diff','--exit-code',sha,'HEAD','--','glacier-android-gecko/'],check=True)
          print('PASS all Android native and original permanent signer QA')
          PY
      - name: Refuse reuse of public tags or hidden draft release
        run: |
          set -euo pipefail
          tag='glacier-android-browser-v0.2.5'
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then exit 3; fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then exit 3; fi
          python3 - <<'PY'
          import json,os,subprocess
          docs=json.loads(subprocess.check_output(['gh','api','repos/'+os.environ['GITHUB_REPOSITORY']+'/releases?per_page=100']))
          if any(x.get('tag_name')=='glacier-android-browser-v0.2.5' for x in docs):
              raise RuntimeError('Cannot overwrite existing hidden/public APK release')
          PY
      - name: Download exact permanent-signed APK from verified Android run
        run: |
          set -euo pipefail
          mkdir -p staged
          gh run download "$QA_RUN" --repo "$GITHUB_REPOSITORY" \
            --name GlacierAndroid-v0.2.5-STABLE-SIGNED-RC-NOT-PUBLISHED --dir staged
          test "$(find staged -type f | wc -l)" -eq 1
          test -f staged/GlacierAndroid-v0.2.5-ARM64-x86_64-release.apk
          test ! -L staged/GlacierAndroid-v0.2.5-ARM64-x86_64-release.apk
      - name: Install Android public verifier
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'build-tools;36.0.0' --channel=3
      - name: Verify full APK SHA256 cert versionCode app ID and dual native cores
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,re,subprocess,hashlib
          from pathlib import Path
          from zipfile import ZipFile
          f=Path('staged/GlacierAndroid-v0.2.5-ARM64-x86_64-release.apk')
          if not 150_000_000<=f.stat().st_size<=600_000_000:
              raise RuntimeError('Abnormal signed Android APK size')
          with f.open('rb') as stream: digest=hashlib.file_digest(stream,'sha256').hexdigest()
          with ZipFile(f) as z:
              names=set(z.namelist())
              for abi in ('arm64-v8a','x86_64'):
                  for lib in ('libxul.so','libsingbox.so'):
                      if 'lib/'+abi+'/'+lib not in names: raise RuntimeError('Missing native engine '+abi+'/'+lib)
          binaries=Path(os.environ['ANDROID_HOME'])/'build-tools'/'36.0.0'
          signer=str(binaries/'apksigner')
          subprocess.run([signer,'verify','--verbose',str(f)],check=True)
          cert=subprocess.check_output([signer,'verify','--print-certs',str(f)],text=True)
          m=re.search(r'Signer #1 certificate SHA-256 digest:\s*([a-fA-F0-9]{64})',cert)
          if not m or m.group(1).lower()!=os.environ['CERT_PIN']:
              raise RuntimeError('Permanent Android signer mismatch')
          pkg=subprocess.check_output([str(binaries/'aapt'),'dump','badging',str(f)],text=True).splitlines()[0]
          for item in ("name='cn.borealos.glacier.geckopreview'","versionCode='14'","versionName='0.2.5'"):
              if item not in pkg: raise RuntimeError('Wrong Android upgrade package/version')
          print('PASS full signed Android 0.2.5 APK SHA256',digest)
          PY
      - name: Create hidden DRAFT release with verified APK
        run: |
          set -euo pipefail
          gh release create glacier-android-browser-v0.2.5 \
            staged/GlacierAndroid-v0.2.5-ARM64-x86_64-release.apk \
            --repo "$GITHUB_REPOSITORY" --target "$BUILD_SHA" --draft \
            --title 'Glacier Browser Android v0.2.5 · 网页账号原生填充' \
            --notes 'Android 0.2.5/versionCode14：用户主动填充 HTTPS 网站账号的独立 GeckoView 会话，不自动提交。保留 VLESS、书签、加密 Cookie 和网站数据。使用原正式 APK 永久签名，升级请直接覆盖安装，不要卸载应用。'
      - name: Check unique hidden draft full SHA256 before public visibility
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,subprocess,hashlib
          from pathlib import Path
          repo=os.environ['GITHUB_REPOSITORY']
          docs=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/releases?per_page=100']))
          rows=[d for d in docs if d.get('tag_name')=='glacier-android-browser-v0.2.5']
          f=Path('staged/GlacierAndroid-v0.2.5-ARM64-x86_64-release.apk')
          with f.open('rb') as stream: sha=hashlib.file_digest(stream,'sha256').hexdigest()
          if len(rows)!=1: raise RuntimeError('Missing unique hidden release')
          d=rows[0]; a=d.get('assets',[])
          if (d.get('draft') is not True or d.get('published_at') is not None
              or d.get('target_commitish')!=os.environ['BUILD_SHA'] or len(a)!=1
              or a[0].get('name')!=f.name or a[0].get('size')!=f.stat().st_size
              or a[0].get('digest')!='sha256:'+sha):
              raise RuntimeError('Android hidden draft digest/source mismatch')
          print('PASS exact signed Android draft',d['id'],sha)
          PY
      - name: Publish only verified Android permanent-signed v0.2.5 APK
        run: |
          set -euo pipefail
          gh release edit glacier-android-browser-v0.2.5 --repo "$GITHUB_REPOSITORY" --draft=false
          gh release view glacier-android-browser-v0.2.5 --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' | grep -Fx false
