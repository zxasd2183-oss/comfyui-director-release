name: Glacier browser-native password manager safety + real Qt UI
on:
  pull_request:
    paths:
      - 'glacier-windows/glacier_password_capture38.py'
      - 'glacier-windows/glacier_password_manager38.py'
      - 'glacier-windows/glacier_account_center26.py'
      - 'glacier-windows/glacier_accounts22.py'
      - 'glacier-windows/main.py'
      - 'glacier-macos/glacier_password_capture38.py'
      - 'glacier-macos/glacier_password_manager38.py'
      - 'glacier-macos/glacier_account_center26.py'
      - 'glacier-macos/glacier_accounts22.py'
      - 'glacier-macos/main.py'
      - 'glacier-android-gecko/app/src/main/java/cn/borealos/glacier/geckopreview/GlacierNativePasswordSave.java'
      - 'glacier-android-gecko/app/src/main/java/cn/borealos/glacier/geckopreview/MainActivity.java'
      - 'glacier-android-gecko/app/src/androidTest/java/cn/borealos/glacier/geckopreview/GlacierNativePasswordSaveInstrumentedTest.java'
      - 'scripts/test_glacier_native_password_manager.py'
      - 'scripts/test_glacier_native_password_android_guards.py'
      - '.github/workflows/glacier-native-password-manager-qa.yml'
permissions:
  contents: read
jobs:
  qt-password-manager:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 14
    env:
      QT_QPA_PLATFORM: offscreen
      QTWEBENGINE_DISABLE_SANDBOX: '1'
      PYTHONPATH: glacier-windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Qt graphics dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -qq -y libegl1 libopengl0 libxkbcommon0
      - name: Install production Qt packages
        run: python -m pip install 'PySide6>=6.8,<7' 'cryptography>=43,<47' 'requests[socks]>=2.32,<3'
      - name: Verify true Qt password manager and native webpage capture contract
        run: python -m unittest -v scripts.test_glacier_native_password_manager
      - name: Check Android native consent + scoped one-click fill source invariants
        run: python -m unittest -v scripts.test_glacier_native_password_android_guards
      - name: Preserve existing account center and same-origin fill tests
        run: |
          python -m unittest -v glacier-windows.test_account_center26
          python -m unittest -v glacier-windows.test_login_fill34
      - name: Compile both desktop startup modules
        run: python -m compileall -q glacier-windows/main.py glacier-macos/main.py glacier-windows/glacier_password_capture38.py glacier-macos/glacier_password_capture38.py
