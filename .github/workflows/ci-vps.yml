name: Test VPS read-only controller

on:
  push:
    branches: [main]
    paths:
      - 'vps-control/**'
      - '.github/workflows/ci-vps.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate local control center
        working-directory: vps-control
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m py_compile api.py app.py check_status.py bridge.py power_ops.py powerctl.py power_v03.py power_write_mcp.py power_approval_http.py
          python -m unittest discover -s tests -v
          bash -n install-ubuntu.sh
          bash -n install-bridge.sh
          bash -n install-powerctl.sh
          bash -n install-power-v03.sh
