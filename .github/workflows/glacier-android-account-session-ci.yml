name: Glacier Android account Cookie session compilation
on:
  pull_request:
    paths:
      - 'glacier-android-gecko/**'
      - '.github/workflows/glacier-android-account-session-ci.yml'
  push:
    branches: [main]
    paths:
      - 'glacier-android-gecko/**'
      - '.github/workflows/glacier-android-account-session-ci.yml'
permissions:
  contents: read
jobs:
  android-account-session:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Android source guards and backward compatible tab snapshots
        run: python -m unittest discover -s glacier-android-gecko/scripts -p test_android_account_sessions.py -v
      - name: Verify exact-origin manual Gecko account fill guards
        run: python -m unittest discover -s glacier-android-gecko/scripts -p test_android_login_fill34.py -v
      - name: Guard Keystore-damaged vault cloud upload and overwrite consent
        run: python -m unittest discover -s glacier-android-gecko/scripts -p test_android_vault_cloud_safety.py -v
      - name: Guard Android cloud vault against server rollback/replay
        run: python -m unittest discover -s glacier-android-gecko/scripts -p test_android_sync_rollback.py -v
      - name: Install pinned Android SDK platform
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          "$sdk/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-37.0' 'build-tools;36.0.0' --channel=3
          if [ -d "$sdk/platforms/android-37.0" ] && [ ! -e "$sdk/platforms/android-37" ]; then
            ln -s android-37.0 "$sdk/platforms/android-37"
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Compile app and instrumented account/tab tests without APK release
        run: |
          gradle -p glacier-android-gecko \
            :app:compileDebugJavaWithJavac :app:compileDebugAndroidTestJavaWithJavac \
            --no-daemon --stacktrace
