name: Glacier Browser v0.20.11 Windows unified release
on:
  push:
    branches:
      - fix/glacier-browser-windows-v0201-input
    paths:
      - 'glacier-windows/**'
      - '.github/workflows/glacier-browser-windows-v0201-input.yml'
      - 'scripts/glacier_prepare_rotated_update.py'
      - 'scripts/glacier_allow_vps_download.py'
      - 'vps-control/sync-glacier-preview-releases.py'
      - 'vps-control/test_glacier_preview_mirror.py'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: glacier-windows-v0201-input
  cancel-in-progress: true
jobs:
  mirror-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate VPS-only mirror metadata and upstream checksum policy
        run: |
          python -m unittest -v vps-control/test_glacier_preview_mirror.py
  build-publish:
    needs: mirror-tests
    runs-on: windows-2022
    env:
      GLACIER_UPDATE_SIGNING_PUBLIC_HEX: ${{ vars.GLACIER_UPDATE_SIGNING_PUBLIC_HEX }}
    timeout-minutes: 65
    defaults:
      run:
        working-directory: glacier-windows
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify pinned updater trust key before packaging
        run: |
          python -c "import os,sys;sys.path.insert(0,'../scripts');from glacier_prepare_rotated_update import validate_public;validate_public(os.environ.get('GLACIER_UPDATE_SIGNING_PUBLIC_HEX',''));print('Glacier updater public key configured')"
          if ($LASTEXITCODE -ne 0) { throw 'Missing Glacier signed-update public key; packaging blocked before downloads.' }
      - name: Download and verify official sing-box binary
        run: |
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          $version = '1.14.4'
          $expected = '99185d75d314a07dbba4a130c8ad986cbeb629a07927975636b341ca61f991df'
          $archive = "sing-box-$version-windows-amd64.zip"
          $sources = @("https://dl.sing-box.org/releases/v$version/$archive", "https://github.com/SagerNet/sing-box/releases/download/v$version/$archive")
          $ok = $false
          foreach ($attempt in 1..4) {
            foreach ($url in $sources) {
              try {
                Invoke-WebRequest -Uri $url -OutFile sing-box.zip -TimeoutSec 90
                if ((Get-FileHash -Algorithm SHA256 sing-box.zip).Hash.ToLowerInvariant() -eq $expected) {
                  $ok = $true
                  break
                }
                Write-Warning "sing-box download hash mismatch; refusing file."
              } catch {
                Write-Warning "sing-box release source temporarily unavailable (attempt $attempt)."
              }
            }
            if ($ok) { break }
            Start-Sleep -Seconds (4 * $attempt)
          }
          if (-not $ok) { throw 'Could not verify official sing-box binary after retry; failing closed' }
          Expand-Archive sing-box.zip -DestinationPath core-unpack
          $exe = @(Get-ChildItem core-unpack -Recurse -Filter sing-box.exe -File)
          if ($exe.Count -ne 1) { throw 'Unexpected sing-box archive layout' }
          Copy-Item $exe[0].FullName bin/sing-box.exe
          & bin/sing-box.exe version
          if ($LASTEXITCODE -ne 0) { throw 'sing-box runtime failed' }
      - name: Install packaging dependencies and decode app modules
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'PySide6>=6.8,<7' 'PyInstaller>=6,<8' 'cryptography>=43,<47' 'requests[socks]>=2.32,<3'
          if ($LASTEXITCODE -ne 0) { throw 'Glacier v0.20 Windows build prerequisite or test failed' }
          python -c "import base64,lzma,pathlib; files=['features.py','ui08.py','ui09.py','ui12.py','tabtools13.py','chrome14.py','update_core.py','update_ui.py']; [(pathlib.Path(f).write_bytes(lzma.decompress(base64.b64decode(pathlib.Path(f+'.xz.b64').read_text().strip())))) for f in files]"
          if ($LASTEXITCODE -ne 0) { throw 'Glacier v0.20 Windows build prerequisite or test failed' }
          python -c "from pathlib import Path; p=Path('update_ui.py'); s=p.read_text(encoding='utf8'); assert 'from update_core import (' in s; s=s.replace('from update_core import (','from secure_update import ('); s=s.replace('每次更新都会校验下载的文件大小与 SHA256。','更新清单使用独立 Ed25519 数字签名，下载包使用 SHA256 校验。'); s=s.replace('公开发布源（经内置 VLESS 代理联网）','自有 VPS HTTPS（Ed25519 签名清单）'); p.write_text(s,encoding='utf8')"
          if ($LASTEXITCODE -ne 0) { throw 'Glacier v0.20 Windows build prerequisite or test failed' }
          python -c "from pathlib import Path; p=Path('update_core.py'); t=p.read_text(encoding='utf8'); old=next((line for line in t.splitlines() if line.strip().startswith('CURRENT_VERSION = ')),None); assert old is not None, 'Missing version constant'; updated=t.replace(old, 'CURRENT_VERSION = '+chr(39)+'0.20.11'+chr(39),1); p.write_text(updated,encoding='utf8'); print('Updated Windows core local version to 0.20.11')"
          if ($LASTEXITCODE -ne 0) { throw 'Glacier v0.20 Windows build prerequisite or test failed' }
          python ../scripts/glacier_allow_vps_download.py update_core.py
          if ($LASTEXITCODE -ne 0) { throw 'Windows VPS installer origin policy failed closed' }
          python ../scripts/glacier_prepare_rotated_update.py windows .
          if ($LASTEXITCODE -ne 0) { throw 'New Glacier v0.20 updater public key is missing or invalid' }
          # Keep the exact historical trust-root rotation guard intact.
          # Only after the public key is safely patched can the preview
          # application's displayed patch version be updated.
          python -c "from pathlib import Path; p=Path('secure_update.py'); s=p.read_text(encoding='utf8'); expected='CURRENT_VERSION = '+chr(39)+'0.20.11'+chr(39); assert s.count(expected)==1, 'Updater version must be 0.20.11'; print('Verified Windows signed-updater version 0.20.11')"
          if ($LASTEXITCODE -ne 0) { throw 'Failed to set preview version after secure key rotation' }
          python -m py_compile main.py windows_desktop15.py test_windows_desktop15.py glacier_productivity16.py test_productivity16.py glacier_workspaces17.py glacier_downloads17.py test_workspaces17.py test_downloads17.py glacier_tabs19.py test_tabs19.py test_downloads19.py test_workspaces19.py glacier_shell20.py test_shell20.py glacier_input21.py test_input21.py glacier_accounts22.py glacier_sync23.py glacier_sync_auto24.py glacier_preview_updates25.py glacier_account_center26.py test_account_center26.py test_accounts22.py test_sync23.py test_preview_updates25.py features.py ui08.py ui09.py ui12.py tabtools13.py chrome14.py update_core.py update_ui.py secure_update.py
          if ($LASTEXITCODE -ne 0) { throw 'Glacier v0.20 Windows build prerequisite or test failed' }
          python -c "import ui12; assert ui12.normalize_input('example.com') == 'https://example.com'; assert ui12.normalize_input('https://example.com').startswith('https:'); print('New window module import checks passed')"
          python -c "from PySide6.QtWebEngineCore import QWebEnginePage; import tabtools13; QWebEnginePage.FindFlag(0); assert tabtools13.copyable_page_url('https://example.com/a') == 'https://example.com/a'; assert not tabtools13.copyable_page_url('javascript:alert(1)'); assert not tabtools13.copyable_page_url('https://name:pass@example.com'); print('Glacier v0.13 tab API and link safety tests passed')"
          python -m unittest -v test_chrome14 test_shell20 test_input21 test_accounts22 test_sync23 test_preview_updates25 test_update_security test_windows_desktop15 test_productivity16 test_workspaces17 test_downloads17 test_tabs19 test_downloads19 test_workspaces19
          $generalCode = $LASTEXITCODE
          Write-Host "Glacier general regression process exit code: $generalCode"
          if ($generalCode -ne 0) { throw "Glacier general regression process failed: $generalCode" }
          python -m unittest -v test_account_center26
          $accountCode = $LASTEXITCODE
          Write-Host "Glacier account GUI regression process exit code: $accountCode"
          if ($accountCode -ne 0) { throw "Glacier account GUI regression process failed: $accountCode" }
          python -c "import update_core; assert update_core.newer_than('0.9.0','0.20.11'); assert not update_core.newer_than('0.20.11','0.9.0'); import update_ui; print('Updater imports and semver checks passed')"
          if ($LASTEXITCODE -ne 0) { throw 'Glacier v0.20 Windows build prerequisite or test failed' }
      - name: Build Windows executable with embedded VLESS core
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onedir --name GlacierBrowser --contents-directory _internal --add-binary 'bin/sing-box.exe;bin' --collect-all PySide6.QtWebEngineCore --collect-all PySide6.QtWebEngineWidgets --hidden-import glacier_sync_auto24 --hidden-import glacier_account_center26 --hidden-import socks main.py
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller failed' }
          if (-not (Test-Path dist/GlacierBrowser/GlacierBrowser.exe)) { throw 'Browser EXE missing' }
          if (-not (Test-Path dist/GlacierBrowser/_internal/bin/sing-box.exe)) { throw 'Bundled sing-box missing' }
          & dist/GlacierBrowser/_internal/bin/sing-box.exe version
          if ($LASTEXITCODE -ne 0) { throw 'Bundled sing-box failed to execute' }
          'Glacier Browser v0.20 lightweight Chrome-like tabs, streamlined toolbar, unified tool hub and redesigned local new-tab page; existing secure features retained. Qt/PySide6 under their applicable licenses; sing-box GPL-3.0-or-later, https://github.com/SagerNet/sing-box. Unsigned test build; review licenses and source before redistribution.' | Set-Content dist/GlacierBrowser/THIRD-PARTY-NOTICES.txt -Encoding utf8
      - name: Compile actual Windows Setup.exe
        run: |
          $iscc = Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { choco install innosetup --yes --no-progress }
          if (-not (Test-Path $iscc)) { throw 'Inno Setup not available' }
          $iss = @'
          [Setup]
          AppId={{A1DDACCC-09D1-41AF-B0B3-B48300D0AD0D}
          AppName=Glacier Browser
          AppVersion=0.20.11
          AppPublisher=Glacier Browser
          DefaultDirName={localappdata}\Programs\GlacierBrowser
          DefaultGroupName=Glacier Browser
          OutputDir=dist
          OutputBaseFilename=GlacierBrowser-v0.20.11-Windows-Setup-x64
          Compression=lzma
          SolidCompression=yes
          PrivilegesRequired=lowest
          ArchitecturesAllowed=x64compatible
          WizardStyle=modern
          CloseApplications=yes
          UninstallDisplayIcon={app}\GlacierBrowser.exe
          [Files]
          Source: "dist\GlacierBrowser\*"; DestDir: "{app}"; Flags: recursesubdirs createallsubdirs ignoreversion
          [Icons]
          Name: "{group}\Glacier Browser"; Filename: "{app}\GlacierBrowser.exe"
          Name: "{autodesktop}\Glacier Browser"; Filename: "{app}\GlacierBrowser.exe"; Tasks: desktopicon
          [Tasks]
          Name: "desktopicon"; Description: "创建桌面快捷方式"; GroupDescription: "附加选项:"
          [Run]
          Filename: "{app}\GlacierBrowser.exe"; Description: "启动冰川浏览器"; Flags: nowait postinstall skipifsilent
          '@
          Set-Content installer.iss $iss -Encoding utf8
          & $iscc installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup compilation failed' }
          if (-not (Test-Path dist/GlacierBrowser-v0.20.11-Windows-Setup-x64.exe)) { throw 'Setup EXE missing' }
      - name: Upload installable Windows artifact for backup
        uses: actions/upload-artifact@v4
        with:
          name: GlacierBrowser-v0.20.11-Windows-Setup
          path: glacier-windows/dist/GlacierBrowser-v0.20.11-Windows-Setup-x64.exe
          if-no-files-found: error
          retention-days: 30
      - name: Publish Windows EXE release (DO NOT publish unsigned feed)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '0.20.11'
          $tag = "glacier-v$version"
          $name = "GlacierBrowser-v$version-Windows-Setup-x64.exe"
          $installer = "dist/$name"
          if (-not (Test-Path $installer)) { throw 'Windows setup missing.' }
          $actual = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
          Write-Host "Windows setup SHA256: $actual"
          "$actual  $name" | Set-Content "dist/$name.sha256" -Encoding ascii
          $published = $false
          for ($attempt=1; $attempt -le 5; $attempt++) {
            gh release view $tag *> $null
            if ($LASTEXITCODE -eq 0) {
              Write-Host 'Canonical Windows release tag already exists; preserving immutable asset.'
              $published = $true
              break
            } else {
              gh release create $tag $installer "dist/$name.sha256" --target $env:GITHUB_SHA --title "Glacier Browser $version (Windows)" --notes "Glacier Browser v0.20.11 unified accounts, encrypted private/work vault sync, embedded VLESS and Ed25519-signed updater. No autofill or automatic bypass of verification challenges. Windows binary is not Authenticode signed."
            }
            if ($LASTEXITCODE -eq 0) { $published = $true; break }
            Write-Warning "Release upload failed on attempt $attempt"
            Start-Sleep -Seconds 15
          }
          if (-not $published) { throw 'Unable to publish Windows setup release after retries.' }
          Write-Host 'Installer published. Signed update feed is issued separately by an offline key, NOT this workflow.'

      - name: Notify authenticated owner VPS mirror immediately after release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run glacier-preview-immediate.yml --ref main --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Could not dispatch owner VPS mirror notification' }
