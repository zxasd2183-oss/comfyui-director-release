name: Glacier RC macOS Apple Silicon QA (never publish)
on:
  push:
    branches:
      - integration/glacier-browser-release-candidate-20261111
      - feature/glacier-desktop-chrome-ui-v021-20261111
      - fix/glacier-macos-keychain-startup-20261111
      - feature/glacier-chrome-shell-splash-sequential-20261111
      - feature/glacier-desktop-pixel-polish-20261111
      - feature/glacier-chrome-finish-v024-v022-20261111
    paths:
      - 'glacier-macos/**'
      - 'glacier-windows/glacier_productivity16.py'
      - 'glacier-windows/test_productivity16.py'
      - 'glacier-windows/glacier_workspaces17.py'
      - 'glacier-windows/glacier_downloads17.py'
      - 'glacier-windows/test_workspaces17.py'
      - 'glacier-windows/test_downloads17.py'
      - 'scripts/glacier_prepare_rotated_update.py'
      - 'glacier-windows/glacier_tabs19.py'
      - 'glacier-windows/test_tabs19.py'
      - 'glacier-windows/test_downloads19.py'
      - 'glacier-windows/test_workspaces19.py'
      - 'glacier-windows/glacier_shell20.py'
      - 'glacier-windows/glacier_chrome_ui30.py'
      - 'glacier-windows/glacier_desktop_ui32.py'
      - 'glacier-windows/glacier_chrome_shell33.py'
      - 'glacier-windows/test_chrome_shell33.py'
      - 'glacier-windows/test_desktop_ui32.py'
      - 'glacier-windows/test_chrome_ui30.py'
      - 'glacier-windows/test_shell20.py'
      - '.github/workflows/glacier-rc-macos.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: glacier-macos-rc-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos-arm64:
    runs-on: macos-26
    env:
      GLACIER_UPDATE_SIGNING_PUBLIC_HEX: ${{ vars.GLACIER_UPDATE_SIGNING_PUBLIC_HEX }}
    timeout-minutes: 70
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'arm64'
      - name: Verify pinned updater trust key before packaging
        run: |
          python - <<'PY'
          import os
          from scripts.glacier_prepare_rotated_update import validate_public
          validate_public(os.environ.get("GLACIER_UPDATE_SIGNING_PUBLIC_HEX", ""))
          print("Glacier updater public key configured")
          PY
      - name: Verify actual Apple Silicon runner
        run: |
          set -euo pipefail
          test "$(uname -m)" = 'arm64'
          python -c 'import platform; assert platform.machine() == "arm64"'
          sw_vers
      - name: Install macOS build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'PySide6>=6.8,<7' 'pyinstaller>=6.11,<8' 'cryptography>=43,<47' 'keyring>=25,<27' 'requests[socks]>=2.32,<3' 'certifi>=2025.10,<2028'
      - name: Decode cross-platform Glacier UI modules
        working-directory: glacier-macos
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,lzma,shutil
          source=Path("../glacier-windows")
          files=("features.py","ui08.py","ui09.py","ui12.py","tabtools13.py","chrome14.py")
          for name in files:
              encoded=(source/(name+".xz.b64")).read_text(encoding="ascii").strip()
              Path(name).write_bytes(lzma.decompress(base64.b64decode(encoded,validate=True)))
              print("Decoded",name)
          PY
          cp ../glacier-windows/glacier_productivity16.py glacier_productivity16.py
          cp ../glacier-windows/test_productivity16.py test_productivity16.py
          for file in glacier_workspaces17.py glacier_downloads17.py test_workspaces17.py test_downloads17.py glacier_tabs19.py test_tabs19.py test_downloads19.py test_workspaces19.py glacier_shell20.py test_shell20.py glacier_chrome_ui30.py test_chrome_ui30.py glacier_site_diagnostic31.py test_site_diagnostic31.py glacier_desktop_ui32.py test_desktop_ui32.py glacier_chrome_shell33.py test_chrome_shell33.py glacier_proxy_health29.py; do cp ../glacier-windows/"$file" "$file"; done
          python ../scripts/glacier_prepare_rotated_update.py macos .
          python -m py_compile glacier_chrome_shell33.py test_chrome_shell33.py glacier_splash.py test_glacier_startup_sequence.py mac_local_vault.py test_mac_local_vault.py test_mac_keychain_startup.py mac_xray_reality.py test_mac_xray_reality.py test_mac_xray_integration.py main.py mac_platform.py mac_update.py mac_update_core.py mac_chrome_adapter.py mac_https_probe.py mac_proxy_diagnostics.py test_mac_proxy_diagnostics.py test_mac_core_log_integration.py mac_ui08.py mac_desktop15.py test_mac_desktop15.py glacier_productivity16.py test_productivity16.py glacier_workspaces17.py glacier_downloads17.py test_workspaces17.py test_downloads17.py glacier_tabs19.py test_tabs19.py test_downloads19.py test_workspaces19.py glacier_shell20.py test_shell20.py glacier_chrome_ui30.py test_chrome_ui30.py glacier_site_diagnostic31.py test_site_diagnostic31.py glacier_proxy_health29.py glacier_accounts22.py glacier_account_center26.py test_account_center26.py glacier_sync23.py glacier_sync_auto24.py test_accounts22.py test_sync23.py features.py ui08.py ui09.py ui12.py tabtools13.py chrome14.py
          python -m unittest -v test_mac_update
          python -m unittest -v test_mac_https_probe
          python -m unittest -v test_mac_proxy_diagnostics
          QT_QPA_PLATFORM=offscreen python -m unittest -v test_mac_xray_reality
          QT_QPA_PLATFORM=offscreen python -m unittest -v test_mac_vless_config
          QT_QPA_PLATFORM=offscreen python -m unittest -v test_mac_gui_start
          QT_QPA_PLATFORM=offscreen python -m unittest -v test_mac_desktop15
          QT_QPA_PLATFORM=offscreen python -m unittest -v test_productivity16
          QT_QPA_PLATFORM=offscreen python -m unittest -v test_workspaces17 test_downloads17 test_tabs19 test_downloads19 test_workspaces19 test_shell20 test_chrome_ui30 test_chrome_shell33 test_glacier_startup_sequence test_site_diagnostic31 test_desktop_ui32 test_account_center26 test_accounts22 test_sync23
          python -c "from mac_update_core import FEED_URL,signed_update_session; assert FEED_URL == 'https://sync.borealos.cn/downloads/macos-arm64.json'; s=signed_update_session(1080); assert not s.trust_env and s.proxies['https']=='socks5h://127.0.0.1:1080'; s.close(); print('VLESS HTTPS signed updater checks passed')"
          python -c "from PySide6.QtWebEngineWidgets import QWebEngineView; import keyring.backends.macOS; import mac_update; print('Qt WebEngine / optional Keychain migration / updater imports passed')"
      - name: Download and SHA256-verify official sing-box 1.14.4 darwin arm64
        working-directory: glacier-macos
        run: |
          set -euo pipefail
          mkdir -p bin core-unpack
          filename='sing-box-1.14.4-darwin-arm64.tar.gz'
          url="https://github.com/SagerNet/sing-box/releases/download/v1.14.4/$filename"
          curl -fL --retry 4 --retry-all-errors --connect-timeout 30 --max-time 420 "$url" -o sing-box.tar.gz
          echo '0d8c7f5ed5d587b0f1a5e9772a708ec3bfa4ac4c9329604b01d8d9c2ba406838  sing-box.tar.gz' | shasum -a 256 -c -
          tar -xzf sing-box.tar.gz -C core-unpack
          found="$(find core-unpack -type f -name sing-box | head -1)"
          test -n "$found"
          cp "$found" bin/sing-box
          chmod 755 bin/sing-box
          file bin/sing-box
          test "$(lipo -archs bin/sing-box)" = 'arm64'
          bin/sing-box version
      - name: Download pinned official Xray 26.11.9 Apple Silicon for modern REALITY
        working-directory: glacier-macos
        run: |
          set -euo pipefail
          mkdir -p xray-unpack bin
          curl -fL --retry 4 --retry-all-errors --connect-timeout 30 --max-time 420 \
            'https://github.com/XTLS/Xray-core/releases/download/v26.11.9/Xray-macos-arm64-v8a.zip' -o xray.zip
          echo '233f0c66681cd0726f81a6b2b6ed6a5710869e312047b522e46ed53035bebd26  xray.zip' | shasum -a 256 -c -
          unzip -q xray.zip -d xray-unpack
          test -f xray-unpack/xray
          cp xray-unpack/xray bin/xray
          chmod 755 bin/xray
          file bin/xray
          test "$(lipo -archs bin/xray)" = 'arm64'
          bin/xray version
      - name: Validate VLESS REALITY Xray configuration with actual Xray 26.11.9
        working-directory: glacier-macos
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,json,subprocess,tempfile,uuid
          from pathlib import Path
          from main import parse_node
          from mac_xray_reality import build_xray_reality_config
          pk=base64.urlsafe_b64encode(bytes(range(32))).decode().rstrip("=")
          node=("vless://"+str(uuid.UUID(int=1))+"@example.com:443?"
                "encryption=none&security=reality&sni=www.example.com&fp=chrome"
                "&pbk="+pk+"&sid=01ab&flow=xtls-rprx-vision")
          config=build_xray_reality_config(parse_node(node),19010)
          with tempfile.TemporaryDirectory() as folder:
              path=Path(folder)/"config.json"
              path.write_text(json.dumps(config),encoding="utf-8")
              result=subprocess.run(["bin/xray","run","-test","-config",str(path)],
                                    capture_output=True,text=True,timeout=20)
              if result.returncode:
                  # Only synthetic test credentials used here, never user's.
                  raise RuntimeError("Xray REALITY client config rejected: "+result.stderr[:500]+result.stdout[:500])
          print("Xray-core 26.11.9 accepts REALITY/SNI/shortId/XTLS Vision config")
          PY

      - name: Prove real REALITY handshake and SOCKS relay between Xray cores
        working-directory: glacier-macos
        run: |
          set -euo pipefail
          QT_QPA_PLATFORM=offscreen python -m unittest -v test_mac_xray_integration

      - name: Validate REALITY and modern dial DNS against actual bundled sing-box
        working-directory: glacier-macos
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,json,subprocess,tempfile,uuid
          from pathlib import Path
          from main import build_proxy_config
          pk=base64.urlsafe_b64encode(bytes(range(32))).decode().rstrip("=")
          base="vless://"+str(uuid.UUID(int=1))+"@example.com:443?encryption=none&security=tls"
          examples={
              "tls":base,
              "websocket":base+"&type=ws&path=%2Fws&ed=1024",
              "httpupgrade":base+"&type=httpupgrade&path=%2Fws",
              "reality":base.replace("security=tls","security=reality")+"&pbk="+pk+"&sid=01ab&flow=xtls-rprx-vision"
          }
          for kind,link in examples.items():
              config=build_proxy_config(link,19010)
              with tempfile.TemporaryDirectory() as temp:
                  cfg=Path(temp)/"config.json"
                  cfg.write_text(json.dumps(config),encoding="utf-8")
                  result=subprocess.run(["bin/sing-box","check","-c",str(cfg)],
                                        capture_output=True,timeout=20,text=True)
                  if result.returncode:
                      raise RuntimeError(kind+" sing-box check failed: "+result.stderr[:500])
                  print("sing-box 1.14.4 validates",kind,"with explicit DNS")
          PY
      - name: Reproduce SOCKS5 code 1 with real sing-box and prove stdout diagnostics
        working-directory: glacier-macos
        run: |
          set -euo pipefail
          python -m unittest -v test_mac_core_log_integration

      - name: Assemble native .app with Qt WebEngine and bundled sing-box
        working-directory: glacier-macos
        run: |
          set -euo pipefail
          python -m PyInstaller --noconfirm --clean --windowed --onedir --name GlacierBrowser \
            --target-architecture arm64 \
            --osx-bundle-identifier cn.borealos.glacierbrowser \
            --add-binary 'bin/sing-box:bin' \
            --add-binary 'bin/xray:bin' \
            --collect-all PySide6.QtWebEngineCore \
            --collect-all PySide6.QtWebEngineWidgets \
            --collect-all keyring \
            --hidden-import keyring.backends.macOS \
            --hidden-import glacier_sync_auto24 --hidden-import glacier_account_center26 \
            --hidden-import socks \
            --collect-all cryptography \
            --collect-data certifi \
            --add-data 'LICENSE-Xray-core.txt:licenses' \
            main.py
          # certifi must exist inside frozen app, not just on the CI runner
          if ! find dist/GlacierBrowser.app -type f -name cacert.pem | grep -q .; then
            echo 'Missing packaged certifi root CA bundle'; exit 1
          fi
          test -d dist/GlacierBrowser.app
          test -f dist/GlacierBrowser.app/Contents/MacOS/GlacierBrowser
          test "$(lipo -archs dist/GlacierBrowser.app/Contents/MacOS/GlacierBrowser)" = 'arm64'
          test "$(find dist/GlacierBrowser.app -type f -name sing-box | wc -l | tr -d ' ')" -ge 1
          test "$(find dist/GlacierBrowser.app -type f -name xray | wc -l | tr -d ' ')" -ge 1
          test "$(find dist/GlacierBrowser.app -type f -name LICENSE-Xray-core.txt | wc -l | tr -d ' ')" -ge 1
          /usr/libexec/PlistBuddy -c 'Set :CFBundleShortVersionString 0.20.22' dist/GlacierBrowser.app/Contents/Info.plist || \
            /usr/libexec/PlistBuddy -c 'Add :CFBundleShortVersionString string 0.20.22' dist/GlacierBrowser.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c 'Set :CFBundleVersion 0.20.22' dist/GlacierBrowser.app/Contents/Info.plist || \
            /usr/libexec/PlistBuddy -c 'Add :CFBundleVersion string 0.20.22' dist/GlacierBrowser.app/Contents/Info.plist
          # Local ad-hoc signature is for Apple Silicon execution only, NOT Developer ID notarization.
          codesign --force --deep --sign - dist/GlacierBrowser.app
          codesign --verify --deep --verbose=2 dist/GlacierBrowser.app
      - name: Create installable Apple Silicon DMG
        working-directory: glacier-macos
        run: |
          set -euo pipefail
          mkdir -p dmg-stage
          ditto dist/GlacierBrowser.app dmg-stage/GlacierBrowser.app
          ln -s /Applications dmg-stage/Applications
          cat > dmg-stage/README-安装说明.txt <<'EOF'
          Glacier Browser v0.20.22 · macOS Apple Silicon 版本
          1. 将 GlacierBrowser.app 拖到 Applications 文件夹。
          2. 该版本未经过 Apple Developer ID 签名/公证，macOS 可能拒绝首次打开。
             请核对发布来源，并在 系统设置 > 隐私与安全性 中按系统提示授权。
             不要全局关闭 Gatekeeper。
          3. 旧用户首次迁移请在 Glacier 提示中主动选择迁移，可能需要最后一次授权。\n             迁移后本机加密文件用于线路及账号存储，旧钥匙串资料不会删除。\n             与钥匙串相比，同一 Mac 用户身份的其他进程可能读取本地密钥，\n             建议启用 FileVault 与 macOS 用户账户保护。新用户可直接导入 VLESS。
          4. 应用内「Mac 更新」仅通过本机 VLESS 访问 GitHub 并验证签名，
             仍需由你在 Finder 中确认替换安装。
          5. 工作区、标签分组、下载历史本地加密存储，覆盖安装不会主动清除数据。
          6. 书签、历史及应用设置使用 Mac 本地数据目录；
             Windows 上的线路/历史不会自动迁移到 Mac。
          版本：0.20.22，架构：Apple Silicon (arm64)
          EOF
          hdiutil create -volname 'Glacier Browser' -srcfolder dmg-stage \
            -ov -format UDZO 'GlacierBrowser-v0.20.22-macOS-AppleSilicon.dmg'
          test -s 'GlacierBrowser-v0.20.22-macOS-AppleSilicon.dmg'
          hdiutil verify 'GlacierBrowser-v0.20.22-macOS-AppleSilicon.dmg'
          shasum -a 256 'GlacierBrowser-v0.20.22-macOS-AppleSilicon.dmg' > 'GlacierBrowser-v0.20.22-macOS-AppleSilicon.dmg.sha256'
          cat 'GlacierBrowser-v0.20.22-macOS-AppleSilicon.dmg.sha256'
      - name: Upload actual DMG for inspection
        uses: actions/upload-artifact@v4
        with:
          name: GlacierBrowser-RC-macOS-AppleSilicon-DMG
          path: glacier-macos/GlacierBrowser-v0.20.22-macOS-AppleSilicon.dmg
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
