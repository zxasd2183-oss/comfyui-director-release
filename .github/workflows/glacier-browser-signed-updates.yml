name: Glacier Browser signed Windows + macOS auto updates

on:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - '.github/workflows/glacier-browser-signed-updates.yml'
      - 'scripts/glacier_publish_signed_updates.py'
      - 'scripts/test_glacier_signed_updates.py'
      - 'scripts/glacier_prepare_rotated_update.py'
      - 'scripts/test_glacier_prepare_rotated_update.py'
      - 'scripts/glacier_rotate_update_key.py'
      - 'scripts/test_glacier_rotate_update_key.py'
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: glacier-dual-signed-update-feed
  cancel-in-progress: false

jobs:
  signed-update-feeds:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check whether original Ed25519 signing key has been provisioned
        id: signer
        env:
          SIGNING_KEY: ${{ secrets.GLACIER_UPDATE_SIGNING_PRIVATE_HEX }}
          SIGNING_PUBLIC: ${{ vars.GLACIER_UPDATE_SIGNING_PUBLIC_HEX }}
        run: |
          set -euo pipefail
          if [[ -z "$SIGNING_KEY" || -z "$SIGNING_PUBLIC" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Glacier v2 private or public key not yet provisioned; signed update feeds remain unchanged."
            echo "Use the trusted device migration script to provision the NEW v2 keypair."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Glacier v2 key configuration present. Python publisher verifies the private/public pair."
          fi

      - name: Checkout trusted publisher from main
        uses: actions/checkout@v5
        with:
          ref: main
          path: source
          persist-credentials: false

      - name: Checkout existing signed feed branch
        if: steps.signer.outputs.enabled == 'true'
        uses: actions/checkout@v5
        with:
          ref: glacier-browser-updates-v2
          path: feed
          persist-credentials: true

      - name: Install signer and execute security regression tests
        run: |
          set -euo pipefail
          python -m pip install 'cryptography>=43,<47'
          python -m unittest -v source/scripts/test_glacier_signed_updates.py source/scripts/test_glacier_prepare_rotated_update.py source/scripts/test_glacier_rotate_update_key.py

      - name: Read both actual GitHub Releases
        if: steps.signer.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" > releases.json
          test -s releases.json

      - name: Report unified-release readiness and version mismatch
        if: steps.signer.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, re, os
          from pathlib import Path
          releases = json.loads(Path("releases.json").read_text(encoding="utf-8"))
          platforms = {"windows": re.compile(r"^glacier-v(\\d+\\.\\d+\\.\\d+)(?:-.*)?$"),
                       "macos": re.compile(r"^glacier-macos-v(\\d+\\.\\d+\\.\\d+)(?:-.*)?$")}
          versions = {}
          for platform, pattern in platforms.items():
              found = []
              for release in releases:
                  if release.get("draft") or not release.get("published_at"):
                      continue
                  match = pattern.fullmatch(str(release.get("tag_name", "")))
                  if match:
                      found.append(tuple(map(int, match.group(1).split("."))))
              versions[platform] = max(found) if found else None
          pretty = lambda v: ".".join(map(str, v)) if v else "missing"
          windows, macos = versions["windows"], versions["macos"]
          lines = ["### Glacier unified update readiness",
                   f"- Latest published Windows release: {pretty(windows)}",
                   f"- Latest published macOS release: {pretty(macos)}"]
          if not windows or not macos or windows != macos:
              lines.append("- ⚠️ Windows and macOS do not yet have a matched release version. Do not claim a unified client update.")
              print("::warning::Glacier Windows/macOS published versions differ; unified signed update not ready")
          else:
              lines.append("- Versions match; signed publishing still requires canonical immutable release tags and valid signatures.")
          lines.append("- Preview/prerelease assets are not automatically promoted to the signed client feed.")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
              output.write("\\n".join(lines) + "\\n")
          print("\\n".join(lines))
          PY

      - name: Check whether there is a newer immutable signed release pair
        id: release-check
        if: steps.signer.outputs.enabled == 'true'
        env:
          GLACIER_UPDATE_SIGNING_PUBLIC_HEX: ${{ vars.GLACIER_UPDATE_SIGNING_PUBLIC_HEX }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from source.scripts.glacier_publish_signed_updates import needs_new_signed_release
          with open("releases.json", encoding="utf-8") as handle:
              releases = json.load(handle)
          needed = needs_new_signed_release(releases, "feed/channels")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("needed=" + str(needed).lower() + "\n")
          if not needed:
              print("No newer canonical signed Release pair. Existing signed manifests stay untouched.")
          PY

      - name: Generate and verify signed Windows and macOS manifests
        if: steps.signer.outputs.enabled == 'true' && steps.release-check.outputs.needed == 'true'
        env:
          GLACIER_UPDATE_SIGNING_PRIVATE_HEX: ${{ secrets.GLACIER_UPDATE_SIGNING_PRIVATE_HEX }}
          GLACIER_UPDATE_SIGNING_PUBLIC_HEX: ${{ vars.GLACIER_UPDATE_SIGNING_PUBLIC_HEX }}
        run: |
          set -euo pipefail
          python source/scripts/glacier_publish_signed_updates.py \
            releases.json feed/channels

      - name: Atomically publish both update channels
        if: steps.signer.outputs.enabled == 'true' && steps.release-check.outputs.needed == 'true'
        run: |
          set -euo pipefail
          cd feed
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add channels/windows-x64.json channels/macos-arm64.json
          if git diff --cached --quiet; then
            echo "Both signed update channels are already current."
            exit 0
          fi
          git commit -m 'Publish pinned-key signed Glacier dual-platform updates'
          git push origin HEAD:glacier-browser-updates-v2
          echo "Windows: signed GitHub channel is published."
          echo "macOS: signed channel published; owner VPS mirror verifies and syncs it."
