name: Build Jipite APK on GitHub
run-name: Jipite Fluent Android signed update (${{ github.event_name }})

on:
  push:
    branches: [main]
    paths:
      - 'android-jipite/app/**'
      - 'android-jipite/scripts/**'
      - '.github/workflows/build-jipite-apk.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'preview (UI-only) or connected (Microsoft login, stable signed APK)'
        type: choice
        options:
          - preview
          - connected
        default: preview
        required: true

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      JIPITE_EVENT: ${{ github.event_name }}
      JIPITE_MODE: ${{ inputs.mode }}
      JIPITE_MS_CLIENT_ID: ${{ vars.JIPITE_MS_CLIENT_ID || '76fb73a5-fc82-4217-893a-6070eedd16be' }}
      JIPITE_KEYSTORE_BASE64: ${{ secrets.JIPITE_KEYSTORE_BASE64 }}
      JIPITE_SIGNING_STORE_PASSWORD: ${{ secrets.JIPITE_SIGNING_STORE_PASSWORD }}
      JIPITE_SIGNING_KEY_ALIAS: ${{ vars.JIPITE_SIGNING_KEY_ALIAS }}
      JIPITE_SIGNING_KEY_PASSWORD: ${{ secrets.JIPITE_SIGNING_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      # Only trusted commits to main can auto-sign; PRs never receive signing secrets.
      # On push this produces both offline preview and stable signed connected APK.
      - name: Configure Microsoft login and verified release signing
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'connected')
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$JIPITE_MS_CLIENT_ID" || -z "$JIPITE_KEYSTORE_BASE64" ||
                -z "$JIPITE_SIGNING_STORE_PASSWORD" || -z "$JIPITE_SIGNING_KEY_ALIAS" ||
                -z "$JIPITE_SIGNING_KEY_PASSWORD" ]]; then
            echo "::error::Configure JIPITE_SIGNING_KEY_ALIAS variable and the three JIPITE signing repository secrets. The public Microsoft Client ID is already configured."
            exit 2
          fi
          keyfile="$RUNNER_TEMP/jipite-signing.p12"
          printf '%s' "$JIPITE_KEYSTORE_BASE64" | base64 -d > "$keyfile"
          chmod 600 "$keyfile"
          keytool -exportcert -alias "$JIPITE_SIGNING_KEY_ALIAS" \
            -keystore "$keyfile" \
            -storepass:env JIPITE_SIGNING_STORE_PASSWORD \
            -file "$RUNNER_TEMP/jipite-signing.cer" >/dev/null
          export SIGNATURE_HASH
          SIGNATURE_HASH="$(openssl dgst -sha1 -binary "$RUNNER_TEMP/jipite-signing.cer" | openssl base64 -A)"
          python3 android-jipite/scripts/configure_msal.py
          echo "JIPITE_SIGNING_KEYSTORE_FILE=$keyfile" >> "$GITHUB_ENV"
          {
            echo "### Microsoft Android app registration"
            echo "Package: cn.borealos.jipite"
            echo "SHA-1 Base64 signature hash:"
            echo ""
            echo "$SIGNATURE_HASH"
            echo ""
            echo "Register this public hash in Microsoft Entra Android platform for the same Client ID."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build preview APK (no Microsoft or Xiaomi registration)
        if: github.event_name != 'workflow_dispatch' || inputs.mode == 'preview'
        working-directory: android-jipite
        run: gradle :app:assembleManualDebug --no-daemon --stacktrace

      - name: Build Microsoft-connected, signed manual approval APK
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'connected')
        working-directory: android-jipite
        run: gradle :app:assembleManualRelease --no-daemon --stacktrace

      - name: Verify APK signatures
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$JIPITE_EVENT" == "push" ]]; then
            # Trusted main branch: verify both offline Debug and signed Release.
            apks=(
              android-jipite/app/build/outputs/apk/manual/debug/app-manual-debug.apk
              android-jipite/app/build/outputs/apk/manual/release/app-manual-release.apk
            )
          elif [[ "$JIPITE_MODE" == "connected" ]]; then
            apks=(android-jipite/app/build/outputs/apk/manual/release/app-manual-release.apk)
          else
            apks=(android-jipite/app/build/outputs/apk/manual/debug/app-manual-debug.apk)
          fi
          for apk in "${apks[@]}"; do
            test -s "$apk"
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk" >/dev/null
            sha256sum "$apk" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload UI-only APK
        if: github.event_name != 'workflow_dispatch' || inputs.mode == 'preview'
        uses: actions/upload-artifact@v4
        with:
          name: Jipite-MuMu-safe-preview
          path: android-jipite/app/build/outputs/apk/manual/debug/app-manual-debug.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload Microsoft-connected signed APK
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'connected')
        uses: actions/upload-artifact@v4
        with:
          name: Jipite-Microsoft-connected-signed
          path: android-jipite/app/build/outputs/apk/manual/release/app-manual-release.apk
          retention-days: 30
          if-no-files-found: error

  publish:
    name: Publish verified Jipite APK to GitHub Releases
    # Signing material remains isolated in the build job. This job only gets
    # the signed APK artifact and limited repository release permissions.
    needs: apk
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Jipite-Microsoft-connected-signed
          path: dist
      - name: Create immutable tagged release for in-app updater
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(sed -nE 's/^[[:space:]]*versionName = "([0-9]+\.[0-9]+\.[0-9]+)".*/\1/p' android-jipite/app/build.gradle.kts | head -n1)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Invalid Jipite version"; exit 2; }
          TAG="jipite-v$VERSION"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Bump version instead of overwriting signed updates."
            exit 3
          fi
          source=dist/app-manual-release.apk
          test -s "$source"
          binary="Jipite-v$VERSION-Microsoft-connected.apk"
          cp "$source" "dist/$binary"
          {
            echo "Jipite $VERSION — Xiaomi real-device security readiness."
            echo ""
            echo "Includes independent Microsoft login, Fluent navigation, owner-hosted VPS"
            echo "HTTPS updates with SHA-256 and APK signing checks, and Android installation"
            echo "confirmation. Xiaomi onboarding now requires explicit unique-device consent,"
            echo "real BIOMETRIC_STRONG challenge and hardware-backed Android Keystore security."
            echo ""
            echo "The manual build does not require the pending Mi Push vendor review."
            echo "GPU provider power permissions and existing TOTP backup remain unchanged."
            echo "See android-jipite/XIAOMI_DEVICE_V010.md for prerequisites and limitations."
          } > dist/release-notes.md
          gh release create "$TAG" "dist/$binary" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "吉皮提 v$VERSION · Fluent" \
            --notes-file dist/release-notes.md --prerelease
          echo "Published $TAG, SHA-256:" >> "$GITHUB_STEP_SUMMARY"
          sha256sum "dist/$binary" >> "$GITHUB_STEP_SUMMARY"
