name: Glacier three-device E2E vault synthetic interoperability
on:
  pull_request:
    paths:
      - 'scripts/test_glacier_three_device_vault_interop.py'
      - 'glacier-android-gecko/app/src/androidTest/assets/glacier_sync_interop_private_v1.json'
      - 'glacier-android-gecko/app/src/androidTest/java/cn/borealos/glacier/geckopreview/GlacierVaultInteropInstrumentedTest.java'
      - '.github/workflows/glacier-three-device-vault-interoperability.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/test_glacier_three_device_vault_interop.py'
      - 'glacier-android-gecko/app/src/androidTest/assets/glacier_sync_interop_private_v1.json'
      - 'glacier-android-gecko/app/src/androidTest/java/cn/borealos/glacier/geckopreview/GlacierVaultInteropInstrumentedTest.java'
      - '.github/workflows/glacier-three-device-vault-interoperability.yml'
permissions:
  contents: read
jobs:
  synthetic-desktop-interoperability:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    strategy:
      fail-fast: false
      matrix:
        platform: [glacier-windows, glacier-macos]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install headless Qt runtime prerequisites
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libopengl0 libxkbcommon0
      - name: Install production vault encryption and Qt modules
        run: python -m pip install 'PySide6>=6.8,<7' 'cryptography>=43,<47' 'requests[socks]>=2.32,<3'
      - name: Verify synthetic desktop-to-Android fixture and multi-device conflicts
        env:
          PYTHONPATH: ${{ matrix.platform }}
        run: |
          python -m unittest -v scripts.test_glacier_three_device_vault_interop
      - name: Check Mac and Windows source equality for sync protocol
        run: |
          cmp glacier-windows/glacier_sync23.py glacier-macos/glacier_sync23.py
          cmp glacier-windows/glacier_sync_auto24.py glacier-macos/glacier_sync_auto24.py
          echo 'PASS: identical encrypted vault and conflict protection on both desktop platforms'
