name: Glacier account login password minimum eight regression

on:
  pull_request:
    paths:
      - 'glacier-windows/glacier_sync23.py'
      - 'glacier-macos/glacier_sync23.py'
      - 'glacier-windows/glacier_account_center26.py'
      - 'glacier-macos/glacier_account_center26.py'
      - 'glacier-windows/test_account_center26.py'
      - 'glacier-android-gecko/app/src/main/java/cn/borealos/glacier/geckopreview/MainActivity.java'
      - 'scripts/test_glacier_account_password_policy.py'
      - '.github/workflows/glacier-account-password-min8-ci.yml'
  push:
    branches: [main]
    paths:
      - 'glacier-windows/glacier_sync23.py'
      - 'glacier-macos/glacier_sync23.py'
      - 'glacier-windows/glacier_account_center26.py'
      - 'glacier-macos/glacier_account_center26.py'
      - 'glacier-windows/test_account_center26.py'
      - 'glacier-android-gecko/app/src/main/java/cn/borealos/glacier/geckopreview/MainActivity.java'
      - 'scripts/test_glacier_account_password_policy.py'
      - '.github/workflows/glacier-account-password-min8-ci.yml'
permissions:
  contents: read

jobs:
  account-login-min8:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirm frontend and encrypted-vault password policies are distinct
        run: python -m unittest -v scripts.test_glacier_account_password_policy
      - name: Install Qt runtime and Python dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libopengl0 libxkbcommon0
          python -m pip install 'PySide6>=6.8,<7' 'cryptography>=43,<47' 'requests[socks]>=2.32,<3'
      - name: Test account register and login UI with 7/8-character fake passwords
        env:
          PYTHONPATH: glacier-windows
        run: python -m unittest discover -s glacier-windows -p 'test_account_center26.py' -v
