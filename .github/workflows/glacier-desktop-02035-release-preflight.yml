name: Glacier desktop 0.20.35 immutable release preflight
on:
  pull_request:
    paths:
      - '.github/workflows/glacier-desktop-02035-verified-release.yml'
      - '.github/workflows/glacier-desktop-02035-release-preflight.yml'
      - 'scripts/test_glacier_desktop_02035_release.py'
permissions:
  contents: read
jobs:
  verify-desktop-publisher:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML parser
        run: python -m pip install 'PyYAML>=6,<7'
      - name: Audit pinned source, two QA artifacts, SHA-256 and immutable publication
        run: python -m unittest -v scripts.test_glacier_desktop_02035_release
