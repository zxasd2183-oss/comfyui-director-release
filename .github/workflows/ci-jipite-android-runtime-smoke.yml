name: Smoke-test Jipite signed APK on Android emulator

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ci-jipite-android-runtime-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launch:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable emulator acceleration
        run: |
          sudo chmod 666 /dev/kvm
      - name: Fetch official signed release APK
        run: |
          set -euo pipefail
          curl -fL --retry 3 --max-time 60 \
            -o /tmp/jipite.apk \
            https://github.com/zxasd2183-oss/comfyui-director-release/releases/download/jipite-v0.9.3/Jipite-v0.9.3-Microsoft-connected.apk
          sha256sum /tmp/jipite.apk
          test "$(sha256sum /tmp/jipite.apk | cut -d' ' -f1)" = "bf1199f33bc22796525a30a01e44fbe0cee118c0a0b44549a342ac378e851ad8"
      - name: Launch Android app without any Microsoft credentials
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_3a
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: bash .github/scripts/jipite-runtime-smoke.sh
      - name: Upload redacted local crash logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: jipite-android-boot-crash-log
          path: |
            /tmp/jipite-crash.log
            /tmp/jipite-launch.txt
          retention-days: 3
