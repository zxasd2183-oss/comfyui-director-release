name: Glacier unreadable account vault must never overwrite cloud
on:
  pull_request:
    paths:
      - 'glacier-windows/glacier_sync23.py'
      - 'glacier-windows/glacier_sync_auto24.py'
      - 'glacier-macos/glacier_sync_auto24.py'
      - 'glacier-macos/glacier_sync23.py'
      - 'glacier-windows/test_sync23.py'
      - 'glacier-macos/test_sync23.py'
      - '.github/workflows/glacier-vault-upload-failclosed-tests.yml'
  push:
    branches: [main]
    paths:
      - 'glacier-windows/glacier_sync23.py'
      - 'glacier-windows/glacier_sync_auto24.py'
      - 'glacier-macos/glacier_sync_auto24.py'
      - 'glacier-macos/glacier_sync23.py'
      - 'glacier-windows/test_sync23.py'
      - 'glacier-macos/test_sync23.py'
      - '.github/workflows/glacier-vault-upload-failclosed-tests.yml'
permissions:
  contents: read
jobs:
  protected-vault:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Qt headless libraries
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libopengl0 libxkbcommon0
      - name: Install Glacier sync test dependencies
        run: python -m pip install 'PySide6>=6.8,<7' 'cryptography>=43,<47' 'requests[socks]>=2.32,<3'
      - name: Enforce identical desktop cloud protection
        run: cmp glacier-windows/glacier_sync23.py glacier-macos/glacier_sync23.py
      - name: Confirm identical desktop auto-sync version rollback guards
        run: cmp glacier-windows/glacier_sync_auto24.py glacier-macos/glacier_sync_auto24.py
      - name: Validate both desktop source and test syntax
        run: python -m py_compile glacier-windows/glacier_sync23.py glacier-windows/glacier_sync_auto24.py glacier-macos/glacier_sync23.py glacier-macos/glacier_sync_auto24.py glacier-windows/test_sync23.py glacier-macos/test_sync23.py
      - name: Test Windows vault preservation and healthy upload
        run: python -m unittest discover -s glacier-windows -p 'test_sync23.py' -v
      - name: Test macOS vault preservation and healthy upload
        run: python -m unittest discover -s glacier-macos -p 'test_sync23.py' -v
