name: Glacier Android GeckoView real emulator core tests

on:
  push:
    branches:
      - experiment/glacier-android-core-ci
    paths:
      - 'glacier-android-gecko/**'
      - 'scripts/glacier_android_ci_smoke.py'
      - '.github/workflows/glacier-android-core-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: glacier-core-emulator-ci
  cancel-in-progress: true

jobs:
  android-emulator-core:
    name: GeckoView real runtime smoke on Android 35 x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable KVM emulator acceleration
        run: |
          ls -la /dev/kvm || true
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install required GeckoView compile SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-37.0' 'build-tools;36.0.0' --channel=3
          sdk="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ -d "$sdk/platforms/android-37.0" ] && [ ! -e "$sdk/platforms/android-37" ]; then
            ln -s android-37.0 "$sdk/platforms/android-37"
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Download and SHA256 verify official sing-box 1.14.4 Android cores
        run: |
          set -euo pipefail
          for spec in \
            'arm64:arm64-v8a:fb3a6c5197f4044f82c8fd75e01ce14c28b6abdd4c3df84bb987d41a962a320f' \
            'amd64:x86_64:e72a8eead1ace9ce84a4ed07dfbf364e87562b736463fc00967b845cf9b3b8ac'; do
            IFS=: read -r upstream abi digest <<< "$spec"
            name="sing-box-1.14.4-android-$upstream"
            curl --fail --location --retry 3 --silent --show-error \
              "https://github.com/SagerNet/sing-box/releases/download/v1.14.4/$name.tar.gz" \
              --output "$name.tar.gz"
            echo "$digest  $name.tar.gz" | sha256sum --check --status
            mkdir -p "tmp-core-$abi" "glacier-android-gecko/app/src/main/jniLibs/$abi"
            tar xzf "$name.tar.gz" -C "tmp-core-$abi"
            binary=$(find "tmp-core-$abi" -type f -name sing-box | head -1)
            test -n "$binary"
            cp "$binary" "glacier-android-gecko/app/src/main/jniLibs/$abi/libsingbox.so"
            chmod 755 "glacier-android-gecko/app/src/main/jniLibs/$abi/libsingbox.so"
            file "glacier-android-gecko/app/src/main/jniLibs/$abi/libsingbox.so"
            case "$abi" in
              arm64-v8a) readelf -h "glacier-android-gecko/app/src/main/jniLibs/$abi/libsingbox.so" | grep -q 'AArch64' ;;
              x86_64) readelf -h "glacier-android-gecko/app/src/main/jniLibs/$abi/libsingbox.so" | grep -q 'X86-64' ;;
            esac
            echo "Verified and bundled sing-box $upstream core"
          done
      - name: Compile actual Android app and run unit tests
        run: |
          gradle -p glacier-android-gecko :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace
      - name: Assert both real browser and VLESS native engines exist
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile
          p='glacier-android-gecko/app/build/outputs/apk/debug/app-debug.apk'
          with ZipFile(p) as z:
              names=set(z.namelist())
              for abi in ('x86_64','arm64-v8a'):
                  for lib in ('libxul.so','libsingbox.so'):
                      assert f'lib/{abi}/{lib}' in names, f'Missing {lib} for {abi}'
          print('PASS: Gecko and sing-box are actually bundled for both architectures')
          PY
      - name: Run real Android emulator and exercise Glacier Gecko UI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: aosp_atd
          arch: x86_64
          profile: pixel_5
          ram-size: 2560M
          heap-size: 384M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: python3 scripts/glacier_android_ci_smoke.py
      - name: Preserve visual evidence and crash diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: glacier-geckoview-emulator-evidence
          path: glacier-android-gecko/build/reports/core-smoke/
          if-no-files-found: ignore
          retention-days: 14
