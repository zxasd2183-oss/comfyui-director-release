name: Test Jipite Android debug and signed-release source

on:
  push:
    branches: [main]
    paths:
      - 'android-jipite/**'
      - '.github/workflows/ci-android-jipite.yml'
  workflow_dispatch:

permissions:
  contents: read

# Rapid changes should test the newest main rather than queue redundant stale CI.
# This is independent of the protected production APK signing/publish workflow.
concurrency:
  group: jipite-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android CI · ${{ matrix.lane }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        lane: [manual, google, signing]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Test Microsoft Android signing/configuration helper
        if: matrix.lane == 'manual'
        working-directory: android-jipite
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Compile UI-only manual APK and test biometric-only policy
        if: matrix.lane == 'manual'
        working-directory: android-jipite
        run: |
          gradle :app:assembleManualDebug :app:testManualDebugUnitTest --no-daemon --stacktrace

      - name: Upload offline UI-only APK (never a connected/signed build)
        if: matrix.lane == 'manual'
        uses: actions/upload-artifact@v4
        with:
          name: jipite-v06-manual-debug-UI-only
          path: android-jipite/app/build/outputs/apk/manual/debug/app-manual-debug.apk
          retention-days: 7
          if-no-files-found: error

      - name: Prepare dummy Firebase config for compilation only
        if: matrix.lane == 'google'
        shell: bash
        run: |
          cat > android-jipite/app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "jipite-ci-not-real",
              "storage_bucket": "jipite-ci-not-real.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:123456789012:android:abcdef0123456789",
                "android_client_info": {
                  "package_name": "cn.borealos.jipite"
                }
              },
              "oauth_client": [],
              "api_key": [{"current_key":"CI_ONLY_NOT_AN_API_KEY"}],
              "services": {"appinvite_service":{"other_platform_oauth_client":[]}}
            }],
            "configuration_version": "1"
          }
          EOF

      - name: Compile Google Android source (not an authenticated APK)
        if: matrix.lane == 'google'
        working-directory: android-jipite
        run: gradle :app:assembleGoogleDebug -PenableFirebase=true --no-daemon --stacktrace

      - name: Rehearse signed release with disposable identity (never published)
        if: matrix.lane == 'signing'
        working-directory: android-jipite
        shell: bash
        run: |
          set -euo pipefail
          # This test key is ephemeral and must NEVER be used for a user APK.
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          export JIPITE_SIGNING_STORE_PASSWORD=local-ci-only
          export JIPITE_SIGNING_KEY_PASSWORD=local-ci-only
          export JIPITE_SIGNING_KEY_ALIAS=ci-ephemeral
          export JIPITE_SIGNING_KEYSTORE_FILE="$tmp/disposable.p12"
          keytool -genkeypair -storetype PKCS12 -keystore "$JIPITE_SIGNING_KEYSTORE_FILE" \
            -storepass:env JIPITE_SIGNING_STORE_PASSWORD \
            -keypass:env JIPITE_SIGNING_KEY_PASSWORD -alias "$JIPITE_SIGNING_KEY_ALIAS" \
            -keyalg EC -groupname secp256r1 -validity 1 -dname "CN=CI Disposable" -noprompt
          keytool -exportcert -keystore "$JIPITE_SIGNING_KEYSTORE_FILE" \
            -alias "$JIPITE_SIGNING_KEY_ALIAS" -storepass:env JIPITE_SIGNING_STORE_PASSWORD \
            -file "$tmp/disposable.cer" >/dev/null
          export SIGNATURE_HASH="$(openssl dgst -sha1 -binary "$tmp/disposable.cer" | openssl base64 -A)"
          export JIPITE_MS_CLIENT_ID=11111111-1111-4111-8111-111111111111
          python3 scripts/configure_msal.py
          gradle :app:assembleManualRelease --no-daemon --stacktrace
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose \
            app/build/outputs/apk/manual/release/app-manual-release.apk
          # No release upload: ID and signing key above are fake.
