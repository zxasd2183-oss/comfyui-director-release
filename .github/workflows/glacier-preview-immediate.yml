# Signed channel publication dispatches this workflow to refresh the VPS immediately.
# Authorized OIDC staging for v0.20.24 Windows / v0.20.22 macOS native UI releases.
# Re-run OIDC staging after the immutable UI polish v0.20.23 / v0.20.21 releases;
# the independent Windows signer requires full VPS installer SHA256 before signing.
name: Glacier preview mirror immediate VPS sync

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/glacier-preview-immediate.yml'
  workflow_run:
    workflows:
      - "Glacier Browser signed Windows + macOS auto updates"
    types: [completed]

permissions:
  contents: read

concurrency:
  group: glacier-preview-immediate-vps-sync
  cancel-in-progress: false

jobs:
  notify-vps:
    name: OIDC notify verified Glacier preview mirror on VPS
    if: >-
      github.repository == 'zxasd2183-oss/comfyui-director-release' &&
      github.ref == 'refs/heads/main' &&
      (
        github.event_name == 'workflow_dispatch' ||
        github.event_name == 'push' ||
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.name == 'Glacier Browser signed Windows + macOS auto updates' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == 'zxasd2183-oss/comfyui-director-release'
        )
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      id-token: write
      contents: read
      actions: write
    steps:
      - name: Notify owner VPS via workflow-bound short-lived OIDC token
        shell: bash
        env:
          NOTIFY_URL: https://sync.borealos.cn/downloads/notify
          OIDC_AUDIENCE: glacier-preview-vps-update-sync
        run: |
          set -euo pipefail
          # Never print the short-lived OIDC token or JWT payload to logs.
          # This workflow must remain at .github/workflows/glacier-preview-immediate.yml
          # on refs/heads/main: the VPS validates workflow_ref, ref and sub.
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"

          token_response="$(curl --fail --silent --show-error \
            --connect-timeout 7 --max-time 12 \
            --get --data-urlencode "audience=${OIDC_AUDIENCE}" \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}")"
          token="$(printf '%s' "$token_response" | python3 -c \
            'import json,sys; print(json.load(sys.stdin)["value"])')"
          test -n "$token"

          # No user-supplied body/URL: VPS picks releases itself, verifies each
          # immutable SHA256 sidecar, and atomically replaces published metadata.
          # A 202 means accepted/queued; it is not proof that mirroring finished.
          status="$(curl --silent --show-error --connect-timeout 7 \
            --max-time 25 --retry 2 --retry-delay 3 --retry-all-errors \
            --output "$RUNNER_TEMP/glacier-preview-notify-response.json" \
            --write-out '%{http_code}' --request POST "$NOTIFY_URL" \
            --header "Authorization: Bearer ${token}" \
            --header "Content-Type: application/json" \
            --data '{}')"
          unset token token_response
          echo "Glacier preview VPS notify HTTP: $status"
          if [[ "$status" != "202" ]]; then
            echo "::error::VPS did not accept immediate mirror sync; existing 30-minute timer remains the fallback."
            exit 1
          fi
          echo "VPS accepted Glacier preview sync request (HTTP 202)." >> "$GITHUB_STEP_SUMMARY"
          echo "Release download and SHA256 verification occur only on the VPS." >> "$GITHUB_STEP_SUMMARY"

      - name: Confirm both VPS channels match their canonical signed metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os, time, urllib.request, urllib.parse
          root="https://sync.borealos.cn/downloads/"
          api="https://api.github.com/repos/zxasd2183-oss/comfyui-director-release/"
          headers={
              "Authorization":"Bearer "+os.environ["GH_TOKEN"],
              "Accept":"application/vnd.github+json",
              "User-Agent":"Glacier-VPS-Signed-Channel-Check/1",
              "Cache-Control":"no-cache",
              "Pragma":"no-cache",
          }
          def github_doc(url):
              with urllib.request.urlopen(
                  urllib.request.Request(url,headers=headers), timeout=20
              ) as reply:
                  return json.load(reply)
          # First pin the immutable HEAD SHA of the signed feed branch,
          # then fetch each file from that SHA through GitHub's REST API.
          # The raw CDN has been seen returning an older v0.20.18 manifest
          # after the Ed25519 publisher committed v0.20.19.
          branch_sha=github_doc(
              api+"git/ref/heads/glacier-browser-updates-v2")["object"]["sha"]
          print("Signed channel source pinned to commit",branch_sha[:12])
          def retry_oidc_mirror():
              # New short-lived GitHub OIDC credential for EACH retry.
              # The VPS never receives or stores a GitHub personal token.
              requrl=os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
              sep="&" if "?" in requrl else "?"
              requrl+=sep+urllib.parse.urlencode({
                  "audience":"glacier-preview-vps-update-sync"})
              req=urllib.request.Request(
                  requrl,headers={"Authorization":"Bearer "+
                      os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]})
              with urllib.request.urlopen(req,timeout=20) as response:
                  bearer=json.load(response)["value"]
              notify=urllib.request.Request(
                  "https://sync.borealos.cn/downloads/notify",
                  data=b"{}",method="POST",
                  headers={"Authorization":"Bearer "+bearer,
                           "Content-Type":"application/json"})
              with urllib.request.urlopen(notify,timeout=25) as response:
                  if response.status!=202:
                      raise RuntimeError("Authenticated VPS retry not accepted")
              print("VPS still behind signed source; new OIDC mirror retry accepted")

          for channel, suffix in (("windows-x64","Windows-Setup-x64.exe"),
                                  ("macos-arm64","macOS-AppleSilicon.dmg")):
              doc=github_doc(api+"contents/channels/"+channel+
                  ".json?ref="+branch_sha)
              if doc.get("encoding")!="base64":
                  raise RuntimeError("GitHub signed JSON encoding is unexpected")
              blob=base64.b64decode(doc["content"].replace("\n",""),validate=True)
              canonical=json.loads(blob.decode("utf-8"))
              for attempt in range(26):
                  live_req=urllib.request.Request(
                      root+channel+".json?nonce="+str(time.time_ns()),
                      headers={"Cache-Control":"no-cache","Pragma":"no-cache"})
                  with urllib.request.urlopen(live_req,timeout=18) as f:
                      live=json.load(f)
                  if live==canonical:
                      break
                  # Fail closed on rollback or mismatched signed identity.
                  if live.get("key_id")!=canonical.get("key_id") or (
                      tuple(map(int,live["version"].split(".")))>
                      tuple(map(int,canonical["version"].split(".")))):
                      raise RuntimeError(channel+" VPS signed channel identity/version conflict")
                  if attempt==25:
                      raise RuntimeError(channel+" VPS did not catch up after OIDC retries")
                  if attempt%3==2:
                      retry_oidc_mirror()
                  time.sleep(12)
              version=canonical["version"]
              assert tuple(map(int,version.split("."))) >= (0,20,10)
              expected=root+"GlacierBrowser-v"+version+"-"+suffix
              assert canonical["url"]==expected,channel+" signed update URL is not VPS"
              assert canonical["key_id"]=="v2-259ea4a7b9da4bea"
              print(channel, "v"+version+" VPS feed matches the canonical Ed25519 signed channel")
          PY

      - name: Queue Windows-only signer after the independently mirrored EXE is available
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Windows no longer waits for a Mac DMG with the same version.
          latest="$(python3 - <<'PY'
          import json,re,urllib.request
          api="https://api.github.com/repos/zxasd2183-oss/comfyui-director-release/releases?per_page=100"
          req=urllib.request.Request(api,headers={"Accept":"application/vnd.github+json","User-Agent":"Glacier-Win-Signer-Notify/1"})
          with urllib.request.urlopen(req,timeout=20) as f: items=json.load(f)
          pattern=re.compile(r"^glacier-v((?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*))$")
          versions=[m.group(1) for r in items if isinstance(r,dict)
                 and r.get("published_at") and not r.get("draft") and not r.get("prerelease")
                 for m in [pattern.fullmatch(str(r.get("tag_name","")))] if m]
          latest=max(versions,key=lambda v:tuple(map(int,v.split(".")))) if versions else ""
          base=("https://raw.githubusercontent.com/zxasd2183-oss/"
                "comfyui-director-release/glacier-browser-updates-v2/channels/windows-x64.json?nonce="
                +str(__import__("time").time_ns()))
          with urllib.request.urlopen(base,timeout=18) as f: signed=json.load(f)["version"]
          if latest and tuple(map(int,latest.split(".")))>tuple(map(int,signed.split("."))):
              print(latest)
          PY
          )"
          if [[ -z "$latest" ]]; then
            echo "No newer Windows installer requires independent signed promotion."
            exit 0
          fi
          # The signer now owns a bounded readiness wait and full-byte hash
          # verification. Dispatch it IMMEDIATELY; polling here duplicates
          # runners and causes stale failures before mirror upload completes.
          gh workflow run glacier-windows-signed-auto.yml --ref main --repo "$GITHUB_REPOSITORY"
          echo "Windows v${latest}: signer queued immediately; it waits for VPS and verifies complete SHA256."

      - name: Request signed release only after the newest paired installers are mirrored
        if: >-
          github.event_name == 'workflow_dispatch' ||
          github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          latest="$(python3 - <<'PY'
          import json, re, urllib.request
          req=urllib.request.Request(
            "https://api.github.com/repos/zxasd2183-oss/comfyui-director-release/releases?per_page=100",
            headers={"Accept":"application/vnd.github+json","User-Agent":"GlacierReleaseMirror/1"})
          with urllib.request.urlopen(req,timeout=20) as f: items=json.load(f)
          platforms=(re.compile(r"^glacier-v(\d+\.\d+\.\d+)$"),
                     re.compile(r"^glacier-macos-v(\d+\.\d+\.\d+)$"))
          found=[]
          for regex in platforms:
              found.append(set(m.group(1) for r in items
                 if r.get("published_at") and not r.get("draft") and not r.get("prerelease")
                 for m in [regex.fullmatch(r.get("tag_name",""))] if m))
          paired=found[0]&found[1]
          version=max(paired,key=lambda v:tuple(map(int,v.split(".")))) if paired else ""
          # Windows and macOS signed feeds may intentionally be different.
          # When macOS catches up, dispatch its paired signer without
          # downgrading a newer standalone Windows signed channel.
          origin=("https://raw.githubusercontent.com/zxasd2183-oss/"
                  "comfyui-director-release/glacier-browser-updates-v2/channels/")
          versions=[]
          for channel in ("windows-x64","macos-arm64"):
              with urllib.request.urlopen(origin+channel+".json?nonce="+
                                          str(__import__("time").time_ns()),timeout=15) as f:
                  versions.append(json.load(f)["version"])
          numbers=lambda v:tuple(map(int,v.split(".")))
          if version and all(numbers(version)>=numbers(v) for v in versions) and any(numbers(version)>numbers(v) for v in versions):
              print(version)
          PY
          )"
          if [[ -z "$latest" ]]; then
            echo 'No newer paired release than current signed VPS channel.'
            exit 0
          fi
          base='https://sync.borealos.cn/downloads/'
          win="GlacierBrowser-v${latest}-Windows-Setup-x64.exe"
          mac="GlacierBrowser-v${latest}-macOS-AppleSilicon.dmg"
          for attempt in $(seq 1 24); do
            w="$(curl --silent --head --location --output /dev/null --write-out '%{http_code}' --max-time 15 "${base}${win}" || true)"
            m="$(curl --silent --head --location --output /dev/null --write-out '%{http_code}' --max-time 15 "${base}${mac}" || true)"
            if [[ "$w" == '200' && "$m" == '200' ]]; then
              echo "VPS now mirrors paired v${latest}; requesting independent full SHA-256 signer."
              gh workflow run glacier-browser-signed-updates.yml --ref main --repo "$GITHUB_REPOSITORY"
              exit 0
            fi
            echo "Awaiting v${latest} mirror $attempt/24: Windows HTTP $w, Mac HTTP $m"
            sleep 12
          done
          echo '::error::Owner VPS did not finish mirroring latest paired installers; signed feed promotion blocked.'
          exit 1
