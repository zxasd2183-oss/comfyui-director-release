name: Glacier preview mirror immediate VPS sync

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/glacier-preview-immediate.yml'
  workflow_run:
    workflows: ["Glacier Browser signed Windows + macOS auto updates"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: glacier-preview-immediate-vps-sync
  cancel-in-progress: false

jobs:
  notify-vps:
    name: OIDC notify verified Glacier preview mirror on VPS
    if: >-
      github.repository == 'zxasd2183-oss/comfyui-director-release' &&
      github.ref == 'refs/heads/main' &&
      (
        github.event_name == 'workflow_dispatch' ||
        github.event_name == 'push' ||
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == 'zxasd2183-oss/comfyui-director-release'
        )
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Notify owner VPS via workflow-bound short-lived OIDC token
        shell: bash
        env:
          NOTIFY_URL: https://sync.borealos.cn/downloads/notify
          OIDC_AUDIENCE: glacier-preview-vps-update-sync
        run: |
          set -euo pipefail
          # Never print the short-lived OIDC token or JWT payload to logs.
          # This workflow must remain at .github/workflows/glacier-preview-immediate.yml
          # on refs/heads/main: the VPS validates workflow_ref, ref and sub.
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"

          token_response="$(curl --fail --silent --show-error \
            --connect-timeout 7 --max-time 12 \
            --get --data-urlencode "audience=${OIDC_AUDIENCE}" \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}")"
          token="$(printf '%s' "$token_response" | python3 -c \
            'import json,sys; print(json.load(sys.stdin)["value"])')"
          test -n "$token"

          # No user-supplied body/URL: VPS picks releases itself, verifies each
          # immutable SHA256 sidecar, and atomically replaces published metadata.
          # A 202 means accepted/queued; it is not proof that mirroring finished.
          status="$(curl --silent --show-error --connect-timeout 7 \
            --max-time 25 --retry 2 --retry-delay 3 --retry-all-errors \
            --output "$RUNNER_TEMP/glacier-preview-notify-response.json" \
            --write-out '%{http_code}' --request POST "$NOTIFY_URL" \
            --header "Authorization: Bearer ${token}" \
            --header "Content-Type: application/json" \
            --data '{}')"
          unset token token_response
          echo "Glacier preview VPS notify HTTP: $status"
          if [[ "$status" != "202" ]]; then
            echo "::error::VPS did not accept immediate mirror sync; existing 30-minute timer remains the fallback."
            exit 1
          fi
          echo "VPS accepted Glacier preview sync request (HTTP 202)." >> "$GITHUB_STEP_SUMMARY"
          echo "Release download and SHA256 verification occur only on the VPS." >> "$GITHUB_STEP_SUMMARY"

      - name: Check v0.20.10 installer staging after notification
        shell: bash
        run: |
          set -euo pipefail
          for file in GlacierBrowser-v0.20.10-Windows-Setup-x64.exe GlacierBrowser-v0.20.10-macOS-AppleSilicon.dmg; do
            code="$(curl --silent --location --output /dev/null --write-out '%{http_code}' --max-time 15 --head "https://sync.borealos.cn/downloads/$file" || true)"
            echo "Current owner VPS mirror: $file HTTP $code"
          done
          echo "Mirror probe is informational: HTTP 202 notify only means accepted, not staging complete." >> "$GITHUB_STEP_SUMMARY"

      - name: Confirm the authenticated notification served the current signed channels
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.request
          root="https://sync.borealos.cn/downloads/"
          origin=("https://raw.githubusercontent.com/zxasd2183-oss/"
                  "comfyui-director-release/glacier-browser-updates-v2/channels/")
          for channel, suffix in (("windows-x64","Windows-Setup-x64.exe"),
                                  ("macos-arm64","macOS-AppleSilicon.dmg")):
              with urllib.request.urlopen(root+channel+".json",timeout=18) as f:
                  live=json.load(f)
              with urllib.request.urlopen(origin+channel+".json",timeout=18) as f:
                  signed=json.load(f)
              assert live==signed, channel+" VPS signed feed differs from canonical release"
              assert live["version"]=="0.20.10",channel+" current signed version differs"
              expected=root+"GlacierBrowser-v0.20.10-"+suffix
              assert live["url"]==expected,channel+" update URL is not VPS"
              assert live["key_id"]=="v2-259ea4a7b9da4bea"
              print(channel, "v0.20.10 VPS signed feed matches the canonical Ed25519 release")
          PY
