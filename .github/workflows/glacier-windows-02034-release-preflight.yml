name: Glacier Windows 0.20.34 verified publication preflight
on:
  pull_request:
    paths:
      - '.github/workflows/glacier-windows-02034-verified-release.yml'
      - '.github/workflows/glacier-windows-02034-release-preflight.yml'
      - 'scripts/test_glacier_windows_02034_release.py'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML reader
        run: python -m pip install 'PyYAML>=6,<7'
      - name: Reject unverified installer publication / auto-update activation
        run: python -m unittest -v scripts.test_glacier_windows_02034_release
