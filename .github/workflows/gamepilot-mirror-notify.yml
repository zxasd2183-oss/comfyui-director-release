name: Notify existing signed VPS mirror of GamePilot Mac releases

on:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - updates/gamepilot-macos-arm64.xml
      - .github/workflows/gamepilot-mirror-notify.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  queue-existing-oidc-mirror:
    if: >-
      github.repository == 'zxasd2183-oss/comfyui-director-release' &&
      (
        (github.event_name == 'release' &&
          startsWith(github.event.release.tag_name, 'gamepilot-mac-v')) ||
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Queue the existing OIDC-authorized Glacier mirror timer worker
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Do not create a new VPS endpoint, OIDC audience, SSH credential,
          # public write route, or new sudo permission. The installed receiver
          # only trusts the established glacier-preview-immediate.yml workflow.
          gh workflow run glacier-preview-immediate.yml \
            --repo "$GITHUB_REPOSITORY" --ref main
          echo 'Existing OIDC mirror workflow queued; not proof of VPS file availability.'

  verify-vps-update:
    name: Verify VPS serves exact signed GamePilot XML and ZIP
    if: >-
      github.repository == 'zxasd2183-oss/comfyui-director-release' &&
      github.event_name != 'release'
    needs: queue-existing-oidc-mirror
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Install verifier dependencies
        run: python -m pip install 'cryptography>=43,<47'
      - name: Wait for complete signed GamePilot mirror and verify all bytes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, sys, time, urllib.error, urllib.request
          from pathlib import Path
          sys.path.insert(0, str(Path.cwd()/"vps-control"))
          import gamepilot_signed_mirror as gp

          official=gp.fetch_appcast()
          version, name, size, zip_sig=gp.signed_feed(official)
          if gp.version_num(version)<(0,4,2):
              raise ValueError("Expected signed VPS-origin GamePilot v0.4.2 or later")
          release=gp.api_json("/releases/tags/gamepilot-mac-v"+version)
          assets=[a for a in release.get("assets",[]) if a.get("name")==name]
          if (release.get("draft") or release.get("prerelease") or
                  len(assets)!=1 or assets[0].get("size")!=size or
                  assets[0].get("state")!="uploaded" or
                  not str(assets[0].get("digest","")).startswith("sha256:")):
              raise ValueError("Immutable GitHub GamePilot Release mismatch")
          canonical_hash=assets[0]["digest"].removeprefix("sha256:")
          # No redirected host or CDN: both files must be served by owner's
          # existing pinned sync.borealos.cn HTTPS vhost.
          xml_url="https://sync.borealos.cn/downloads/gamepilot-macos-arm64.xml"
          zip_url=f"https://sync.borealos.cn/downloads/{name}"
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  raise ValueError("GamePilot VPS mirror redirected unexpectedly")
          opener=urllib.request.build_opener(NoRedirect())
          for attempt in range(1,31):
              try:
                  with opener.open(urllib.request.Request(xml_url,headers={"Cache-Control":"no-cache"}),timeout=15) as r:
                      if r.status!=200 or r.geturl()!=xml_url:
                          raise ValueError("Invalid VPS signed appcast response")
                      from_vps=r.read(gp.MAX_FEED+1)
                  if from_vps!=official:
                      raise ValueError("VPS signed XML does not yet match GitHub canonical signed feed")
                  with opener.open(urllib.request.Request(zip_url),timeout=35) as r:
                      if r.status!=200 or r.geturl()!=zip_url:
                          raise ValueError("Invalid VPS ZIP status/origin")
                      contents=r.read(size+1)
                  if len(contents)!=size or hashlib.sha256(contents).hexdigest()!=canonical_hash:
                      raise ValueError("VPS ZIP bytes differ from immutable GitHub SHA256")
                  gp.PUB.verify(zip_sig,contents)
                  print(f"PASS GamePilot v{version}: VPS XML exact match, Ed25519 ZIP signature and {size} bytes SHA256 verified")
                  break
              except (OSError, ValueError) as exc:
                  if attempt==30:
                      raise RuntimeError(f"Signed GamePilot VPS mirror not ready after 30 probes: {exc}") from exc
                  print(f"GamePilot signed mirror not yet ready ({attempt}/30): {type(exc).__name__}: {exc}",flush=True)
                  time.sleep(4)
          PY
