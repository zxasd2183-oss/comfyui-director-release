name: Glacier Browser v0.16 Windows verified artifact finalize
on:
  push:
    branches:
      - build/glacier-browser-v0-16-dual
    paths:
      - '.github/workflows/glacier-browser-windows-finalize-v016.yml'
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  restore-verified-setup:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download EXE from passing strict-test build
        uses: actions/download-artifact@v4
        with:
          name: GlacierBrowser-v0.16.0-Windows-Setup
          run-id: 41955869548
          github-token: ${{ github.token }}
          path: dist
      - name: Verify binary digest and finalize v0.16 release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: zxasd2183-oss/comfyui-director-release
        run: |
          set -euo pipefail
          file='dist/GlacierBrowser-v0.16.0-Windows-Setup-x64.exe'
          test -s "$file"
          printf '%s  %s\n' \
            '84734dba6e5801f83b6d70a39104da68f2114ac78d71ec940bdca8025c7c3bb8' "$file" | sha256sum -c -
          gh release view glacier-v0.16.0 >/dev/null
          gh release upload glacier-v0.16.0 "$file" --clobber
          gh release view glacier-v0.16.0 --json assets
          echo "Verified v0.16.0 Windows Setup.exe restored from strict-test CI build 41955869548"
