name: Glacier Android 0.2.11 verified updater release preflight
on:
  pull_request:
    paths:
      - '.github/workflows/glacier-android-0211-updater-verified-release.yml'
      - '.github/workflows/glacier-android-0211-updater-release-preflight.yml'
      - 'scripts/test_glacier_android_0211_updater_release.py'
permissions:
  contents: read
jobs:
  release-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML test dependency
        run: python -m pip install 'PyYAML>=6,<7'
      - name: Audit immutable signed QA source, native checks, and draft-publish safety
        run: python -m unittest -v scripts.test_glacier_android_0211_updater_release
