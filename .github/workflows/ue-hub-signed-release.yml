name: Publish signed Director UE Hub API release

# Trusted main-branch code only; never sign a PR branch.
on:
  workflow_run:
    workflows: ["Director UE Worker offline tests"]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: "Optional expected reviewed Hub API version"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: director-ue-hub-signed-release
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || 'main' }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ue-hub-updates
          path: feed
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install verifier
        run: python -m pip install 'cryptography>=43,<47'
      - name: Verify signing identity and monotonic version
        id: preflight
        env:
          REQUESTED: ${{ inputs.version || '' }}
          SIGNING_PRIVATE: ${{ secrets.DIRECTOR_UE_SIGNING_PRIVATE_HEX }}
          SIGNING_PUBLIC: ${{ vars.DIRECTOR_UE_SIGNING_PUBLIC_HEX }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,re,sys
          from pathlib import Path
          sys.path.insert(0, "trusted/vps-control")
          from ue_hub_signed_updater import verify_manifest,version
          source=Path("trusted/vps-control/hub_app.py").read_text("utf-8")
          found=re.findall(r'^UE_HUB_API_VERSION = "(\d+\.\d+\.\d+)"$',source,re.M)
          if len(found)!=1: raise SystemExit("Expected reviewed UE_HUB_API_VERSION")
          value=found[0]
          version(value)
          if os.environ["REQUESTED"] and os.environ["REQUESTED"]!=value:
              raise SystemExit("Requested version does not match reviewed code")
          pub=os.environ.get("SIGNING_PUBLIC","")
          pri=os.environ.get("SIGNING_PRIVATE","")
          if not re.fullmatch("[a-f0-9]{64}",pub) or not re.fullmatch("[a-f0-9]{64}",pri):
              raise SystemExit("Dedicated UE signing key unconfigured")
          prior=Path("feed/channel.json")
          publish=True
          if prior.exists():
              old=verify_manifest(prior.read_bytes(),pub)
              publish=version(value)>version(old["version"])
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write(f"version={value}\npublish={str(publish).lower()}\n")
          PY
      - name: Sign and verify two-file release
        if: steps.preflight.outputs.publish == 'true'
        env:
          DIRECTOR_UE_SIGNING_PRIVATE_HEX: ${{ secrets.DIRECTOR_UE_SIGNING_PRIVATE_HEX }}
          DIRECTOR_UE_SIGNING_PUBLIC_HEX: ${{ vars.DIRECTOR_UE_SIGNING_PUBLIC_HEX }}
          VERSION: ${{ steps.preflight.outputs.version }}
        run: |
          set -euo pipefail
          python trusted/vps-control/ue_hub_sign_release.py "$VERSION" trusted/vps-control dist-hub
          python - <<'PY'
          import os,sys
          from pathlib import Path
          sys.path.insert(0, "trusted/vps-control")
          from ue_hub_signed_updater import verify_manifest,files_from_archive
          doc=verify_manifest(Path("dist-hub/channel.json").read_bytes(),
                              os.environ["DIRECTOR_UE_SIGNING_PUBLIC_HEX"])
          archive=Path("dist-hub/ue-hub-v"+doc["version"]+".zip").read_bytes()
          assert set(files_from_archive(archive,doc))=={"hub_app.py","ue_worker_rpc.py"}
          PY
      - name: Publish immutable GitHub release
        if: steps.preflight.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.preflight.outputs.version }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          tag="ue-hub-v$VERSION"
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Existing Hub release cannot be overwritten"
            exit 1
          fi
          if git -C trusted ls-remote --tags origin "refs/tags/$tag" | grep -q .; then
            echo "::error::Hub tag already exists"
            exit 1
          fi
          gh release create "$tag" "dist-hub/ue-hub-v$VERSION.zip" \
            --repo "$GITHUB_REPOSITORY" --target "$TESTED_SHA" \
            --title "Director UE Hub API v$VERSION" \
            --notes "Ed25519-signed two-file private MCP update; Worker and power services untouched."
      - name: Advance signed Hub channel after immutable release exists
        if: steps.preflight.outputs.publish == 'true'
        run: |
          set -euo pipefail
          cp dist-hub/channel.json feed/channel.json
          cd feed
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add channel.json
          git commit -m "Publish signed Director UE Hub API ${{ steps.preflight.outputs.version }}"
          git push origin HEAD:ue-hub-updates
