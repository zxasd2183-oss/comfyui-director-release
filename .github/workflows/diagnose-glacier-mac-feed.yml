name: Diagnose public Glacier Mac feed version and signature
on:
  push:
    branches: [diagnostic/glacier-mac-feed-0142]
    paths:
      - '.github/workflows/diagnose-glacier-mac-feed.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-live-vps:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Probe VPS HTTPS and verify pinned Ed25519 signature
        shell: bash
        run: |
          set -euo pipefail
          python -m pip -q install 'cryptography>=43,<47'
          python - <<'PY'
          import base64,json,urllib.request,urllib.error,ssl
          from pathlib import Path
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PublicKey
          url='https://jipite.borealos.cn/glacier-updates/macos-arm64.json'
          expected=json.loads(Path('channels/macos-arm64.json').read_text())
          print('GitHub published version:',expected['version'],flush=True)
          req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','Pragma':'no-cache','User-Agent':'Glacier-Mac-Updater-Diagnostic/1'})
          try:
              with urllib.request.urlopen(req,timeout=18) as resp:
                  body=resp.read(65537)
                  print('VPS HTTP:',resp.status,'bytes:',len(body),'cache:',resp.headers.get('Cache-Control'),
                        'age:',resp.headers.get('Age'),'content-type:',resp.headers.get('Content-Type'),flush=True)
          except Exception as e:
              print('VPS GET failed:',type(e).__name__,str(e)[:280],flush=True)
              raise
          assert len(body)<=65536
          def unique(pairs):
              d={}
              for k,v in pairs:
                  if k in d:raise ValueError('Duplicate signed key')
                  d[k]=v
              return d
          current=json.loads(body.decode('utf-8-sig'),object_pairs_hook=unique)
          print('VPS published version:',current.get('version'),flush=True)
          print('VPS matches GitHub version:',current.get('version')==expected.get('version'),flush=True)
          print('Exact JSON bytes match:',body.strip()==Path('channels/macos-arm64.json').read_bytes().strip(),flush=True)
          print('Fields match:',current==expected,flush=True)
          public=Ed25519PublicKey.from_public_bytes(bytes.fromhex('7c375bfd04b4941a662a9a66e9c3f980653cb01b9e5df286ec651eca84e26dab'))
          pub=current.copy()
          sig=base64.b64decode(pub.pop('signature'),validate=True)
          public.verify(sig,json.dumps(pub,sort_keys=True,ensure_ascii=False,separators=(',',':'),allow_nan=False).encode('utf-8'))
          print('VPS Ed25519 signature VALID; sha256:',current.get('sha256'),flush=True)
          installer=current['url']
          head=urllib.request.Request(installer,method='HEAD',headers={'User-Agent':'Glacier-Mac-Updater-Diagnostic/1'})
          try:
              with urllib.request.urlopen(head,timeout=20) as resp:
                  print('VPS DMG HEAD:',resp.status,'size:',resp.headers.get('Content-Length'),flush=True)
          except Exception as e:
              print('VPS DMG HEAD failed:',type(e).__name__,str(e)[:280],flush=True)
          PY
