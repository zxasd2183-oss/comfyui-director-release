name: Director brain scene bridge isolated contract

on:
  push:
    paths:
      - "studio/studio_brain.py"
      - "studio/tests/test_episode_scene_brain.py"
      - "studio/tests/test_character_brain_bridge.py"
      - "vps-control/hub_app.py"
      - ".github/workflows/director-brain-scene-ci.yml"
  pull_request:
    paths:
      - "studio/studio_brain.py"
      - "studio/tests/test_episode_scene_brain.py"
      - "studio/tests/test_character_brain_bridge.py"
      - "vps-control/hub_app.py"
      - ".github/workflows/director-brain-scene-ci.yml"

permissions:
  contents: read

jobs:
  offline-brain-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile signed Studio brain and Hub extension
        run: python -m py_compile studio/studio_brain.py vps-control/hub_app.py
      - name: Exercise scene draft and live-readiness guards
        run: python -m unittest discover -s studio/tests -p 'test_episode_scene_brain.py' -v
      - name: Preserve legacy character brain isolation
        run: python -m unittest discover -s studio/tests -p 'test_character_brain_bridge.py' -v
