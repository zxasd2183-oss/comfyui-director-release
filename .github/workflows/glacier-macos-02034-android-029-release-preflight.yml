name: Glacier macOS 0.20.34 Android 0.2.9 release safety preflight
on:
  pull_request:
    paths:
      - '.github/workflows/glacier-macos-02034-android-029-verified-release.yml'
      - '.github/workflows/glacier-macos-02034-android-029-release-preflight.yml'
      - 'scripts/test_glacier_macos02034_android029_release.py'
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML parser
        run: python -m pip install 'PyYAML>=6,<7'
      - name: Confirm pinned original native QA, permanent certificate, immutable digest and shell gates
        run: python -m unittest -v scripts.test_glacier_macos02034_android029_release
