name: Glacier Browser v0.11.0 Windows signed-manifest release
on:
  push:
    branches:
      - build/glacier-browser-v0-11
    paths:
      - 'glacier-windows/**'
      - '.github/workflows/glacier-browser-release.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-publish:
    runs-on: windows-2022
    timeout-minutes: 65
    defaults:
      run:
        working-directory: glacier-windows
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and verify official sing-box binary
        run: |
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          $version = '1.14.4'
          $expected = '99185d75d314a07dbba4a130c8ad986cbeb629a07927975636b341ca61f991df'
          $archive = "sing-box-$version-windows-amd64.zip"
          $sources = @("https://dl.sing-box.org/releases/v$version/$archive", "https://github.com/SagerNet/sing-box/releases/download/v$version/$archive")
          $ok = $false
          foreach ($url in $sources) {
            try {
              Invoke-WebRequest -Uri $url -OutFile sing-box.zip -TimeoutSec 90
              if ((Get-FileHash -Algorithm SHA256 sing-box.zip).Hash.ToLowerInvariant() -eq $expected) { $ok = $true; break }
            } catch { Write-Warning "Unavailable core source." }
          }
          if (-not $ok) { throw 'Could not verify official sing-box binary' }
          Expand-Archive sing-box.zip -DestinationPath core-unpack
          $exe = @(Get-ChildItem core-unpack -Recurse -Filter sing-box.exe -File)
          if ($exe.Count -ne 1) { throw 'Unexpected sing-box archive layout' }
          Copy-Item $exe[0].FullName bin/sing-box.exe
          & bin/sing-box.exe version
          if ($LASTEXITCODE -ne 0) { throw 'sing-box runtime failed' }
      - name: Install packaging dependencies and decode app modules
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'PySide6>=6.8,<7' 'PyInstaller>=6,<8' 'cryptography>=43,<47'
          python -c "import base64,lzma,pathlib; files=['features.py','ui08.py','ui09.py','update_core.py','update_ui.py']; [(pathlib.Path(f).write_bytes(lzma.decompress(base64.b64decode(pathlib.Path(f+'.xz.b64').read_text().strip())))) for f in files]"
          python -c "from pathlib import Path; p=Path('update_ui.py'); s=p.read_text(encoding='utf8'); assert 'from update_core import (' in s; s=s.replace('from update_core import (','from secure_update import ('); s=s.replace('每次更新都会校验下载的文件大小与 SHA256。','更新清单使用独立 Ed25519 数字签名，下载包使用 SHA256 校验。'); p.write_text(s,encoding='utf8')"
          python -m py_compile main.py features.py ui08.py ui09.py update_core.py update_ui.py secure_update.py
          python -m unittest -v test_update_security
          python -c "import update_core; assert update_core.newer_than('0.9.0','0.11.0'); assert not update_core.newer_than('0.11.0','0.9.0'); import update_ui; print('Updater imports and semver checks passed')"
      - name: Build Windows executable with embedded VLESS core
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onedir --name GlacierBrowser --contents-directory _internal --add-binary 'bin/sing-box.exe;bin' --collect-all PySide6.QtWebEngineCore --collect-all PySide6.QtWebEngineWidgets main.py
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller failed' }
          if (-not (Test-Path dist/GlacierBrowser/GlacierBrowser.exe)) { throw 'Browser EXE missing' }
          if (-not (Test-Path dist/GlacierBrowser/_internal/bin/sing-box.exe)) { throw 'Bundled sing-box missing' }
          & dist/GlacierBrowser/_internal/bin/sing-box.exe version
          if ($LASTEXITCODE -ne 0) { throw 'Bundled sing-box failed to execute' }
          'Glacier Browser v0.10 update preview. Qt/PySide6 under their applicable licenses; sing-box GPL-3.0-or-later, https://github.com/SagerNet/sing-box. Unsigned test build; review licenses and source before redistribution.' | Set-Content dist/GlacierBrowser/THIRD-PARTY-NOTICES.txt -Encoding utf8
      - name: Compile actual Windows Setup.exe
        run: |
          $iscc = Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { choco install innosetup --yes --no-progress }
          if (-not (Test-Path $iscc)) { throw 'Inno Setup not available' }
          $iss = @'
          [Setup]
          AppId={{A1DDACCC-09D1-41AF-B0B3-B48300D0AD0D}
          AppName=Glacier Browser
          AppVersion=0.11.0
          AppPublisher=Glacier Browser Preview
          DefaultDirName={localappdata}\Programs\GlacierBrowser
          DefaultGroupName=Glacier Browser
          OutputDir=dist
          OutputBaseFilename=GlacierBrowser-v0.11.0-Windows-Setup-x64
          Compression=lzma
          SolidCompression=yes
          PrivilegesRequired=lowest
          ArchitecturesAllowed=x64compatible
          WizardStyle=modern
          CloseApplications=yes
          UninstallDisplayIcon={app}\GlacierBrowser.exe
          [Files]
          Source: "dist\GlacierBrowser\*"; DestDir: "{app}"; Flags: recursesubdirs createallsubdirs ignoreversion
          [Icons]
          Name: "{group}\Glacier Browser"; Filename: "{app}\GlacierBrowser.exe"
          Name: "{autodesktop}\Glacier Browser"; Filename: "{app}\GlacierBrowser.exe"; Tasks: desktopicon
          [Tasks]
          Name: "desktopicon"; Description: "创建桌面快捷方式"; GroupDescription: "附加选项:"
          [Run]
          Filename: "{app}\GlacierBrowser.exe"; Description: "启动冰川浏览器"; Flags: nowait postinstall skipifsilent
          '@
          Set-Content installer.iss $iss -Encoding utf8
          & $iscc installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup compilation failed' }
          if (-not (Test-Path dist/GlacierBrowser-v0.11.0-Windows-Setup-x64.exe)) { throw 'Setup EXE missing' }
      - name: Upload installable Windows artifact for backup
        uses: actions/upload-artifact@v4
        with:
          name: GlacierBrowser-v0.11.0-Windows-Setup
          path: glacier-windows/dist/GlacierBrowser-v0.11.0-Windows-Setup-x64.exe
          if-no-files-found: error
          retention-days: 30
      - name: Publish Windows EXE release (DO NOT publish unsigned feed)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '0.11.0'
          $tag = "glacier-v$version"
          $name = "GlacierBrowser-v$version-Windows-Setup-x64.exe"
          $installer = "dist/$name"
          if (-not (Test-Path $installer)) { throw 'Windows setup missing.' }
          $actual = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
          Write-Host "Windows setup SHA256: $actual"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $installer --clobber
          } else {
            gh release create $tag $installer --target build/glacier-browser-v0-11 --title "Glacier Browser $version (Windows preview)" --notes "Glacier Browser v0.11.0: independent Ed25519-signed update feed verification. Windows executable remains unsigned and requires install approval." --prerelease
          }
          if ($LASTEXITCODE -ne 0) { throw 'Unable to publish Windows setup release.' }
          Write-Host 'Installer published. Signed update feed is issued separately by an offline key, NOT this workflow.'
