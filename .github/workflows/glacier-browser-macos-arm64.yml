name: Glacier Browser macOS Apple Silicon v0.20.8 unified release
on:
  push:
    branches:
      - build/glacier-browser-v0-20-ui-refresh
    paths:
      - 'glacier-macos/**'
      - 'glacier-windows/glacier_productivity16.py'
      - 'glacier-windows/test_productivity16.py'
      - 'glacier-windows/glacier_workspaces17.py'
      - 'glacier-windows/glacier_downloads17.py'
      - 'glacier-windows/test_workspaces17.py'
      - 'glacier-windows/test_downloads17.py'
      - 'scripts/glacier_prepare_rotated_update.py'
      - 'glacier-windows/glacier_tabs19.py'
      - 'glacier-windows/test_tabs19.py'
      - 'glacier-windows/test_downloads19.py'
      - 'glacier-windows/test_workspaces19.py'
      - 'glacier-windows/glacier_shell20.py'
      - 'glacier-windows/test_shell20.py'
      - '.github/workflows/glacier-browser-macos-arm64.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: glacier-macos-ui-refresh
  cancel-in-progress: true
jobs:
  macos-arm64:
    runs-on: macos-26
    env:
      GLACIER_UPDATE_SIGNING_PUBLIC_HEX: ${{ vars.GLACIER_UPDATE_SIGNING_PUBLIC_HEX }}
    timeout-minutes: 70
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'arm64'
      - name: Verify pinned updater trust key before packaging
        run: |
          python - <<'PY'
          import os
          from scripts.glacier_prepare_rotated_update import validate_public
          validate_public(os.environ.get("GLACIER_UPDATE_SIGNING_PUBLIC_HEX", ""))
          print("Glacier updater public key configured")
          PY
      - name: Verify actual Apple Silicon runner
        run: |
          set -euo pipefail
          test "$(uname -m)" = 'arm64'
          python -c 'import platform; assert platform.machine() == "arm64"'
          sw_vers
      - name: Install macOS build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'PySide6>=6.8,<7' 'pyinstaller>=6.11,<8' 'cryptography>=43,<47' 'keyring>=25,<27' 'requests[socks]>=2.32,<3' 'certifi>=2025.10,<2028'
      - name: Decode cross-platform Glacier UI modules
        working-directory: glacier-macos
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,lzma,shutil
          source=Path("../glacier-windows")
          files=("features.py","ui08.py","ui09.py","ui12.py","tabtools13.py","chrome14.py")
          for name in files:
              encoded=(source/(name+".xz.b64")).read_text(encoding="ascii").strip()
              Path(name).write_bytes(lzma.decompress(base64.b64decode(encoded,validate=True)))
              print("Decoded",name)
          PY
          cp ../glacier-windows/glacier_productivity16.py glacier_productivity16.py
          cp ../glacier-windows/test_productivity16.py test_productivity16.py
          for file in glacier_workspaces17.py glacier_downloads17.py test_workspaces17.py test_downloads17.py glacier_tabs19.py test_tabs19.py test_downloads19.py test_workspaces19.py glacier_shell20.py test_shell20.py; do cp ../glacier-windows/"$file" "$file"; done
          python ../scripts/glacier_prepare_rotated_update.py macos .
          python -m py_compile main.py mac_platform.py mac_update.py mac_update_core.py mac_chrome_adapter.py mac_https_probe.py mac_ui08.py mac_desktop15.py test_mac_desktop15.py glacier_productivity16.py test_productivity16.py glacier_workspaces17.py glacier_downloads17.py test_workspaces17.py test_downloads17.py glacier_tabs19.py test_tabs19.py test_downloads19.py test_workspaces19.py glacier_shell20.py test_shell20.py glacier_accounts22.py glacier_account_center26.py test_account_center26.py glacier_sync23.py glacier_sync_auto24.py test_accounts22.py test_sync23.py features.py ui08.py ui09.py ui12.py tabtools13.py chrome14.py
          python -m unittest -v test_mac_update
          python -m unittest -v test_mac_https_probe
          QT_QPA_PLATFORM=offscreen python -m unittest -v test_mac_gui_start
          QT_QPA_PLATFORM=offscreen python -m unittest -v test_mac_desktop15
          QT_QPA_PLATFORM=offscreen python -m unittest -v test_productivity16
          QT_QPA_PLATFORM=offscreen python -m unittest -v test_workspaces17 test_downloads17 test_tabs19 test_downloads19 test_workspaces19 test_shell20 test_account_center26 test_accounts22 test_sync23
          python -c "from mac_update_core import FEED_URL,signed_update_session; assert FEED_URL.startswith('https://raw.githubusercontent.com/'); s=signed_update_session(1080); assert not s.trust_env and s.proxies['https']=='socks5h://127.0.0.1:1080'; s.close(); print('VLESS HTTPS signed updater checks passed')"
          python -c "from PySide6.QtWebEngineWidgets import QWebEngineView; import keyring.backends.macOS; import mac_update; print('Qt WebEngine / Keychain / updater imports passed')"
      - name: Download and SHA256-verify official sing-box 1.14.4 darwin arm64
        working-directory: glacier-macos
        run: |
          set -euo pipefail
          mkdir -p bin core-unpack
          filename='sing-box-1.14.4-darwin-arm64.tar.gz'
          url="https://github.com/SagerNet/sing-box/releases/download/v1.14.4/$filename"
          curl -fL --retry 4 --retry-all-errors --connect-timeout 30 --max-time 420 "$url" -o sing-box.tar.gz
          echo '0d8c7f5ed5d587b0f1a5e9772a708ec3bfa4ac4c9329604b01d8d9c2ba406838  sing-box.tar.gz' | shasum -a 256 -c -
          tar -xzf sing-box.tar.gz -C core-unpack
          found="$(find core-unpack -type f -name sing-box | head -1)"
          test -n "$found"
          cp "$found" bin/sing-box
          chmod 755 bin/sing-box
          file bin/sing-box
          test "$(lipo -archs bin/sing-box)" = 'arm64'
          bin/sing-box version
      - name: Assemble native .app with Qt WebEngine and bundled sing-box
        working-directory: glacier-macos
        run: |
          set -euo pipefail
          python -m PyInstaller --noconfirm --clean --windowed --onedir --name GlacierBrowser \
            --target-architecture arm64 \
            --osx-bundle-identifier cn.borealos.glacierbrowser \
            --add-binary 'bin/sing-box:bin' \
            --collect-all PySide6.QtWebEngineCore \
            --collect-all PySide6.QtWebEngineWidgets \
            --collect-all keyring \
            --hidden-import keyring.backends.macOS \
            --hidden-import glacier_sync_auto24 --hidden-import glacier_account_center26 \
            --hidden-import socks \
            --collect-all cryptography \
            --collect-data certifi \
            main.py
          # certifi must exist inside frozen app, not just on the CI runner
          if ! find dist/GlacierBrowser.app -type f -name cacert.pem | grep -q .; then
            echo 'Missing packaged certifi root CA bundle'; exit 1
          fi
          test -d dist/GlacierBrowser.app
          test -f dist/GlacierBrowser.app/Contents/MacOS/GlacierBrowser
          test "$(lipo -archs dist/GlacierBrowser.app/Contents/MacOS/GlacierBrowser)" = 'arm64'
          test "$(find dist/GlacierBrowser.app -type f -name sing-box | wc -l | tr -d ' ')" -ge 1
          /usr/libexec/PlistBuddy -c 'Set :CFBundleShortVersionString 0.20.8' dist/GlacierBrowser.app/Contents/Info.plist || \
            /usr/libexec/PlistBuddy -c 'Add :CFBundleShortVersionString string 0.20.8' dist/GlacierBrowser.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c 'Set :CFBundleVersion 0.20.8' dist/GlacierBrowser.app/Contents/Info.plist || \
            /usr/libexec/PlistBuddy -c 'Add :CFBundleVersion string 0.20.8' dist/GlacierBrowser.app/Contents/Info.plist
          # Local ad-hoc signature is for Apple Silicon execution only, NOT Developer ID notarization.
          codesign --force --deep --sign - dist/GlacierBrowser.app
          codesign --verify --deep --verbose=2 dist/GlacierBrowser.app
      - name: Create installable Apple Silicon DMG
        working-directory: glacier-macos
        run: |
          set -euo pipefail
          mkdir -p dmg-stage
          ditto dist/GlacierBrowser.app dmg-stage/GlacierBrowser.app
          ln -s /Applications dmg-stage/Applications
          cat > dmg-stage/README-安装说明.txt <<'EOF'
          Glacier Browser v0.20.8 · macOS Apple Silicon 版本
          1. 将 GlacierBrowser.app 拖到 Applications 文件夹。
          2. 该版本未经过 Apple Developer ID 签名/公证，macOS 可能拒绝首次打开。
             请核对发布来源，并在 系统设置 > 隐私与安全性 中按系统提示授权。
             不要全局关闭 Gatekeeper。
          3. 首次启动请粘贴 VLESS 分享链接，仅存入本机钥匙串。
          4. 应用内「Mac 更新」仅通过本机 VLESS 访问 GitHub 并验证签名，
             仍需由你在 Finder 中确认替换安装。
          5. 工作区、标签分组、下载历史本地加密存储，覆盖安装不会主动清除数据。
          6. 书签、历史及应用设置使用 Mac 本地数据目录；
             Windows 上的线路/历史不会自动迁移到 Mac。
          版本：0.20.8，架构：Apple Silicon (arm64)
          EOF
          hdiutil create -volname 'Glacier Browser' -srcfolder dmg-stage \
            -ov -format UDZO 'GlacierBrowser-v0.20.8-macOS-AppleSilicon.dmg'
          test -s 'GlacierBrowser-v0.20.8-macOS-AppleSilicon.dmg'
          hdiutil verify 'GlacierBrowser-v0.20.8-macOS-AppleSilicon.dmg'
          shasum -a 256 'GlacierBrowser-v0.20.8-macOS-AppleSilicon.dmg' > 'GlacierBrowser-v0.20.8-macOS-AppleSilicon.dmg.sha256'
          cat 'GlacierBrowser-v0.20.8-macOS-AppleSilicon.dmg.sha256'
      - name: Upload actual DMG for inspection
        uses: actions/upload-artifact@v4
        with:
          name: GlacierBrowser-v0.20.8-macOS-AppleSilicon-DMG
          path: glacier-macos/GlacierBrowser-v0.20.8-macOS-AppleSilicon.dmg
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Publish Mac-only release (update feed signed separately)
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: glacier-macos
        run: |
          set -euo pipefail
          tag="glacier-macos-v0.20.8"
          dmg='GlacierBrowser-v0.20.8-macOS-AppleSilicon.dmg'
          for attempt in 1 2 3 4 5; do
            if gh release view "$tag" >/dev/null 2>&1; then
              echo 'Canonical macOS release exists; preserving immutable asset'
              break
            else
              gh release create "$tag" "$dmg" "$dmg.sha256" --target "$GITHUB_SHA" \
                --title 'Glacier Browser 0.20.8 · macOS Apple Silicon' \
                --notes 'Unified accounts, device approvals, E2E encrypted vault sync, VLESS, signed update verification. DMG is not Apple Developer ID signed/notarized.' \
                && break
            fi
            if [ "$attempt" = 5 ]; then exit 1; fi
            sleep 20
          done
          gh release view "$tag" --json tagName,assets
          echo 'Mac release available. Ed25519 update feed published independently after offline signature.'
