name: Glacier verified v0.20.29 release security preflight
on:
  pull_request:
    paths:
      - '.github/workflows/glacier-verified-v029-android024-release.yml'
      - '.github/workflows/glacier-verified-release-preflight.yml'
      - 'scripts/test_glacier_verified_release_v029.py'
      - '.github/workflows/glacier-v029-publish-existing-drafts.yml'
      - 'scripts/test_glacier_v029_resume_release.py'
permissions:
  contents: read
jobs:
  verify-release-invariants:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate workflow YAML
        run: python -m pip install 'PyYAML>=6,<7'
      - name: Enforce only tested immutable Glacier release inputs and signing gates
        run: |
          python -m py_compile scripts/test_glacier_verified_release_v029.py
          python -m unittest discover -s scripts -p 'test_glacier_verified_release_v029.py' -v
          python -m unittest discover -s scripts -p 'test_glacier_v029_resume_release.py' -v
