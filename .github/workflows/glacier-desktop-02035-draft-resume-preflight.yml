name: Glacier desktop verified draft resume preflight
on:
  pull_request:
    paths:
      - '.github/workflows/glacier-desktop-02035-resume-verified-drafts.yml'
      - '.github/workflows/glacier-desktop-02035-draft-resume-preflight.yml'
      - 'scripts/test_glacier_desktop_02035_draft_resume.py'
permissions:
  contents: read
jobs:
  verify-draft-resume:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML parser
        run: python -m pip install 'PyYAML>=6,<7'
      - name: Verify fixed Release IDs, SHA256 and no-overwrite guards
        run: python -m unittest -v scripts.test_glacier_desktop_02035_draft_resume
