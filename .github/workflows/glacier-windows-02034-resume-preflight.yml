name: Glacier 0.20.34 draft resume safety preflight
on:
  pull_request:
    paths:
      - '.github/workflows/glacier-windows-02034-resume-draft.yml'
      - '.github/workflows/glacier-windows-02034-resume-preflight.yml'
      - 'scripts/test_glacier_windows_02034_resume.py'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML parser
        run: python -m pip install 'PyYAML>=6,<7'
      - name: Verify immutable draft resume safety and bash syntax
        run: python -m unittest -v scripts.test_glacier_windows_02034_resume
