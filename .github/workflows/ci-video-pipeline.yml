name: Video pipeline offline tests

on:
  push:
    branches: [main]
    paths:
      - 'video-pipeline/**'
      - '.github/workflows/ci-video-pipeline.yml'
  pull_request:
    paths:
      - 'video-pipeline/**'
      - '.github/workflows/ci-video-pipeline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    name: Validate shot planner, queue and output archive
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python source without GPU
        run: python -m compileall -q video-pipeline
      - name: Validate GPU installer shell syntax
        run: bash -n video-pipeline/install-on-gpu.sh
      - name: Run offline unit tests
        run: python -m unittest discover -s video-pipeline/tests -p 'test_*.py' -v
