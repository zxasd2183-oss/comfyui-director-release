name: Glacier framed Chrome tabs — verified Windows v0.20.27 one-time release
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/glacier-framed-chrome-v027-once.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: glacier-framed-chrome-v027-once
  cancel-in-progress: false

jobs:
  publish-verified-windows:
    if: github.repository == 'zxasd2183-oss/comfyui-director-release' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      GH_PROMPT_DISABLED: '1'
      WINDOWS_QA_RUN: '43186672658'
      WINDOWS_TAG: glacier-v0.20.27
      WINDOWS_ASSET: GlacierBrowser-v0.20.27-Windows-Setup-x64.exe
    steps:
      - name: Checkout exact main to verify source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require a new immutable version and matching source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          files={
              'glacier-windows/secure_update.py':"CURRENT_VERSION = '0.20.27'",
              'glacier-windows/main.py':'Windows v0.20.27',
              'scripts/glacier_prepare_rotated_update.py':'"windows": "0.20.27"',
              '.github/workflows/glacier-rc-windows.yml':'GlacierBrowser-v0.20.27-Windows-Setup-x64.exe'
          }
          for name,expected in files.items():
              if expected not in Path(name).read_text(encoding='utf8'):
                  raise RuntimeError('Version and source mismatch: '+name)
          if '"macos": "0.20.24"' not in Path('scripts/glacier_prepare_rotated_update.py').read_text():
              raise RuntimeError('Unchanged macOS release identity not preserved')
          print('Checked new Windows release identity and retained macOS 0.20.24')
          PY
          if gh release view "$WINDOWS_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release already exists, never overwrite"; exit 2
          fi
          if [[ -n "$(git ls-remote --tags origin "refs/tags/$WINDOWS_TAG")" ]]; then
            echo "::error::Immutable tag already exists"; exit 3
          fi

      - name: Require successful native Windows source QA, unchanged after squash
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,subprocess
          repo=os.environ['GITHUB_REPOSITORY']
          runid=os.environ['WINDOWS_QA_RUN']
          run=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs/{runid}']))
          if (run.get('status')!='completed' or run.get('conclusion')!='success'
              or run.get('head_branch')!='feature/glacier-framed-tabstrip-36-20261112'
              or run.get('repository',{}).get('full_name')!=repo):
              raise RuntimeError('Native Windows QA run did not succeed on pinned source')
          sha=run['head_sha']
          if subprocess.run(['git','cat-file','-e',sha+'^{commit}'],
                            stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode:
              subprocess.run(['git','fetch','--no-tags','origin',sha],check=True)
          # Byte-equivalent sources after a squash merge. Reject ANY untested app
          # or signing-policy changes; do not require commit-ancestor topology.
          subprocess.run(['git','diff','--quiet',sha,'HEAD','--','glacier-windows',
                          'scripts/glacier_prepare_rotated_update.py'],check=True)
          print('Native Windows QA source verified:',runid,sha)
          PY

      - name: Download exactly the native Windows installer and visible UI proof
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staged/proof
          gh run download "$WINDOWS_QA_RUN" --repo "$GITHUB_REPOSITORY" \
            --name GlacierBrowser-RC-Windows-Setup --dir staged
          gh run download "$WINDOWS_QA_RUN" --repo "$GITHUB_REPOSITORY" \
            --name GlacierBrowser-Windows-v0.20.27-Live-Chrome-UI --dir staged/proof

      - name: Check complete bytes and screenshot before publication
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,os,pathlib
          installer=pathlib.Path('staged')/os.environ['WINDOWS_ASSET']
          screenshot=pathlib.Path('staged/proof/Glacier-Windows-v0.20.27-live-ui33.png')
          if not installer.exists() or installer.stat().st_size < 100_000_000:
              raise RuntimeError('Verified installable Windows candidate missing')
          if installer.open('rb').read(2)!=b'MZ':
              raise RuntimeError('Windows candidate is not an EXE')
          if not screenshot.exists() or screenshot.stat().st_size < 20_000:
              raise RuntimeError('Native visible UI screenshot missing or too small')
          if screenshot.open('rb').read(8)!=b'\x89PNG\r\n\x1a\n':
              raise RuntimeError('Windows screenshot invalid PNG')
          digest=hashlib.file_digest(installer.open('rb'),'sha256').hexdigest()
          print('Windows release SHA256:',digest)
          print('Installer bytes:',installer.stat().st_size)
          print('Live header screenshot bytes:',screenshot.stat().st_size)
          pathlib.Path('staged/expected-sha256.txt').write_text(digest)
          PY

      - name: Stage immutable GitHub Windows Release as draft
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$WINDOWS_TAG" "staged/$WINDOWS_ASSET" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft \
            --title 'Glacier Browser Windows v0.20.27 — 顶部标签与窗口按钮完整收进同一框内' \
            --notes '顶部布局正式修复：标签页、关闭按钮、加号、系统窗口按钮在同一条有边界的第一排内，窗口宽度 720/1050/1360 均做过原生几何验收。去除额外灰线，保留系统拖动/最大化/缩放和现有标签功能。保留 VLESS、账号、Cookie 和 Ed25519 安全更新。Windows 无商业 Authenticode 代码签名。'

      - name: Verify GitHub draft asset is exactly the tested installer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,pathlib,subprocess
          repo=os.environ['GITHUB_REPOSITORY']
          tag=os.environ['WINDOWS_TAG']
          info=json.loads(subprocess.check_output(
              ['gh','api',f'repos/{repo}/releases/tags/{tag}']))
          if not info.get('draft'):
              raise RuntimeError('Release unexpectedly public before asset validation')
          assets=info.get('assets',[])
          if len(assets)!=1 or assets[0]['name']!=os.environ['WINDOWS_ASSET']:
              raise RuntimeError('Draft release asset mismatch')
          installer=pathlib.Path('staged')/os.environ['WINDOWS_ASSET']
          expected=pathlib.Path('staged/expected-sha256.txt').read_text().strip()
          if assets[0]['size']!=installer.stat().st_size:
              raise RuntimeError('Draft remote asset byte count mismatch')
          if assets[0].get('digest')!='sha256:'+expected:
              raise RuntimeError('Draft remote SHA256 mismatch')
          print('Exact full Windows installer verified in GitHub draft Release')
          PY

      - name: Publish exactly one verified Windows Release and request signed VPS update
        shell: bash
        run: |
          set -euo pipefail
          gh release edit "$WINDOWS_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          gh workflow run glacier-preview-immediate.yml --repo "$GITHUB_REPOSITORY" --ref main
          gh workflow run glacier-windows-signed-auto.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo 'Windows 0.20.27 immutable release published; existing independent Ed25519 signing and OIDC VPS mirror queued.' >> "$GITHUB_STEP_SUMMARY"
