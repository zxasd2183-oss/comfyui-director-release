name: Director UE Worker offline tests

on:
  push:
    paths:
      - "ue-worker/**"
      - "vps-control/ue_worker_rpc.py"
      - "vps-control/tests/test_ue_*.py"
      - "vps-control/hub_app.py"
      - "vps-control/ue_hub_signed_updater.py"
      - "vps-control/ue_hub_sign_release.py"
      - "vps-control/install-ue-hub-signed-updater.sh"
      - ".github/workflows/ue-worker-signed-release.yml"
      - ".github/workflows/ue-hub-signed-release.yml"
      - ".github/workflows/ci-ue-worker.yml"
  pull_request:
    paths:
      - "ue-worker/**"
      - "vps-control/ue_worker_rpc.py"
      - "vps-control/tests/test_ue_*.py"
      - "vps-control/hub_app.py"
      - "vps-control/ue_hub_signed_updater.py"
      - "vps-control/ue_hub_sign_release.py"
      - "vps-control/install-ue-hub-signed-updater.sh"
      - ".github/workflows/ue-worker-signed-release.yml"
      - ".github/workflows/ue-hub-signed-release.yml"
      - ".github/workflows/ci-ue-worker.yml"

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install signed update verifier dependency
        run: python -m pip install 'cryptography>=43,<47'
      - name: Compile
        run: python -m py_compile ue-worker/agent.py ue-worker/ue_jobs.py ue-worker/unreal_build_episode.py ue-worker/unreal_build_stage.py ue-worker/ue_previs.py ue-worker/ue_process.py ue-worker/ue_logs.py ue-worker/ue_preview_images.py ue-worker/ue_signed_updater.py ue-worker/ue_sign_release.py ue-worker/unreal_create_previs_preset.py vps-control/ue_worker_rpc.py vps-control/hub_app.py vps-control/ue_hub_signed_updater.py vps-control/ue_hub_sign_release.py
      - name: Test Windows worker API without GPU
        run: python -m unittest discover -s ue-worker/tests -p "test_*.py" -v
      - name: Verify deployed MCP v1 image transport dependency
        run: python -m pip install 'mcp>=1.29,<2'
      - name: Test private VPS adapter and MCP image content
        run: python -m unittest discover -s vps-control/tests -p "test_ue_*.py" -v
      - name: Validate one-time VPS root bootstrap syntax
        run: bash -n vps-control/install-ue-hub-signed-updater.sh

  windows-bootstrap-parse:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Windows PowerShell bootstrap syntax
        shell: pwsh
        run: |
          foreach ($path in @("ue-worker/WindowsBootstrap.ps1", "ue-worker/install-v02.ps1", "ue-worker/install-v03.ps1", "ue-worker/install-v04.ps1", "ue-worker/install-v05.ps1", "ue-worker/install-v051.ps1", "ue-worker/install-v052.ps1", "ue-worker/install-signed-updater.ps1", "ue-worker/setup-signed-auto-updates-once.ps1")) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path).Path, [ref]$tokens, [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error "$path : $_" }
              throw "PowerShell syntax verification failed: $path"
            }
            Write-Host "Syntax OK: $path"
          }

      - name: Test native Windows PowerShell 5.1 parser and scheduler construction
        shell: powershell
        run: |
          if ($PSVersionTable.PSVersion.Major -ne 5) {
            throw "Expected inbox Windows PowerShell 5.1"
          }
          foreach ($path in @("ue-worker/setup-signed-auto-updates-once.ps1", "ue-worker/install-signed-updater.ps1", "ue-worker/install-v052.ps1")) {
            $tokens = $null
            $issues = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path).Path, [ref]$tokens, [ref]$issues
            ) | Out-Null
            if ($issues.Count -gt 0) {
              throw "Windows PowerShell 5.1 parse failure: $path"
            }
          }
          # Build a task definition only; do not register it or touch SYSTEM.
          $args = '"C:\Program Files\Director UE\ue_signed_updater.py"'
          $action = New-ScheduledTaskAction -Execute "C:\Program Files\Python\python.exe" -Argument $args
          $trigger = New-ScheduledTaskTrigger -Once -At (Get-Date).AddMinutes(1) -RepetitionInterval (New-TimeSpan -Minutes 5) -RepetitionDuration (New-TimeSpan -Days 3650)
          $principal = New-ScheduledTaskPrincipal -UserId SYSTEM -LogonType ServiceAccount -RunLevel Highest
          $settings = New-ScheduledTaskSettingsSet -StartWhenAvailable -MultipleInstances IgnoreNew -ExecutionTimeLimit (New-TimeSpan -Minutes 4)
          $definition = New-ScheduledTask -Action $action -Trigger $trigger -Principal $principal -Settings $settings
          if (-not $definition -or $action.Arguments -ne $args) {
            throw "Scheduled task quoting/syntax regression"
          }
          Write-Host "PS 5.1 syntax, quoted paths and bounded 3650-day trigger verified"

      - name: Verify account identity matching without privileged operations
        shell: pwsh
        run: |
          . ./ue-worker/WindowsBootstrap.ps1
          $sid = "S-1-5-21-1234-2345-3456-1001"
          $cases = @(
            @{ Value = $sid; Ok = $true },
            @{ Value = "*$sid"; Ok = $true },
            @{ Value = "DirectorUEWorker"; Ok = $true },
            @{ Value = "TESTHOST\DirectorUEWorker"; Ok = $true },
            @{ Value = ".\DirectorUEWorker"; Ok = $true },
            @{ Value = "OTHERHOST\DirectorUEWorker"; Ok = $false },
            @{ Value = "Administrator"; Ok = $false },
            @{ Value = "DirectorUEWorker2"; Ok = $false },
            @{ Value = "*S-1-5-21-1234-2345-3456-1002"; Ok = $false }
          )
          foreach ($item in $cases) {
            $actual = Test-DirectorUELocalIdentity -Value $item.Value -AccountName "DirectorUEWorker" -Sid $sid -ComputerName "TESTHOST"
            if ($actual -ne $item.Ok) {
              throw "Identity matching failed for '$($item.Value)': wanted $($item.Ok), got $actual"
            }
          }
          foreach ($principal in @("DirectorUEWorker", "TESTHOST\DirectorUEWorker", $sid)) {
            if (-not (Test-DirectorUEPrincipal -Principal $principal -AccountName "DirectorUEWorker" -Sid $sid -ComputerName "TESTHOST")) {
              throw "Scheduled Task principal mismatch for '$principal'"
            }
          }
          Write-Host "Local-account and resolved-SID cases pass"
