name: Director UE Worker offline tests

on:
  push:
    paths:
      - "ue-worker/**"
      - "vps-control/ue_worker_rpc.py"
      - "vps-control/tests/test_ue_*.py"
      - "vps-control/hub_app.py"
      - "vps-control/ue_hub_signed_updater.py"
      - "vps-control/ue_hub_sign_release.py"
      - "vps-control/install-ue-hub-signed-updater.sh"
      - ".github/workflows/ue-worker-signed-release.yml"
      - ".github/workflows/ue-hub-signed-release.yml"
      - ".github/workflows/ci-ue-worker.yml"
  pull_request:
    paths:
      - "ue-worker/**"
      - "vps-control/ue_worker_rpc.py"
      - "vps-control/tests/test_ue_*.py"
      - "vps-control/hub_app.py"
      - "vps-control/ue_hub_signed_updater.py"
      - "vps-control/ue_hub_sign_release.py"
      - "vps-control/install-ue-hub-signed-updater.sh"
      - ".github/workflows/ue-worker-signed-release.yml"
      - ".github/workflows/ue-hub-signed-release.yml"
      - ".github/workflows/ci-ue-worker.yml"

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install signed update verifier dependency
        run: python -m pip install 'cryptography>=43,<47'
      - name: Compile
        run: python -m py_compile ue-worker/agent.py ue-worker/ue_jobs.py ue-worker/unreal_build_episode.py ue-worker/unreal_build_stage.py ue-worker/ue_previs.py ue-worker/ue_process.py ue-worker/ue_logs.py ue-worker/ue_preview_images.py ue-worker/ue_signed_updater.py ue-worker/ue_sign_release.py ue-worker/unreal_create_previs_preset.py vps-control/ue_worker_rpc.py vps-control/hub_app.py vps-control/ue_hub_signed_updater.py vps-control/ue_hub_sign_release.py
      - name: Test Windows worker API without GPU
        run: python -m unittest discover -s ue-worker/tests -p "test_*.py" -v
      - name: Verify deployed MCP v1 image transport dependency
        run: python -m pip install 'mcp>=1.29,<2'
      - name: Test private VPS adapter and MCP image content
        run: python -m unittest discover -s vps-control/tests -p "test_ue_*.py" -v
      - name: Validate one-time VPS root bootstrap syntax
        run: bash -n vps-control/install-ue-hub-signed-updater.sh

  windows-bootstrap-parse:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify per-user Windows Credential Manager desktop resume
        shell: pwsh
        run: |
          python -m unittest ue-worker.tests.test_desktop_share.DesktopBridgeTests.test_windows_credential_manager_round_trip -v
      - name: Verify interactive-token task principal construction (no registration)
        shell: pwsh
        run: |
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = New-ScheduledTaskPrincipal -UserId $identity.User.Value -LogonType Interactive -RunLevel Limited
          $trigger = New-ScheduledTaskTrigger -AtLogOn -User $identity.Name
          if ($principal.LogonType.ToString() -ne 'Interactive' -or -not $trigger) { throw 'Interactive-token task principal unavailable' }
          Write-Host "Passwordless interactive task definition validated"
      - name: Verify persisted interactive-token task with Windows Task Scheduler
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $name = 'DirectorHeroCI-' + [Guid]::NewGuid().ToString('N')
          $action = New-ScheduledTaskAction -Execute (Join-Path $env:SystemRoot 'System32\cmd.exe') -Argument '/c exit 0'
          $trigger = New-ScheduledTaskTrigger -AtLogOn -User $identity.Name
          $principal = New-ScheduledTaskPrincipal -UserId $identity.User.Value -LogonType Interactive -RunLevel Limited
          try {
            Register-ScheduledTask -TaskName $name -Action $action -Trigger $trigger -Principal $principal -Description 'Director CI interactive task' -ErrorAction Stop | Out-Null
            $scheduler = New-Object -ComObject Schedule.Service
            $scheduler.Connect()
            $def = $scheduler.GetFolder('\').GetTask($name).Definition
            if ([int]$def.Principal.LogonType -ne 3) { throw 'Interactive token logon type missing' }
            if ([int]$def.Principal.RunLevel -ne 0) { throw 'Unexpected elevation' }
            $id = [string]$def.Principal.UserId
            if ($id -ne $identity.User.Value) {
              if ($id -like 'S-1-*') { throw 'Persisted principal SID mismatch' }
              $account = New-Object System.Security.Principal.NTAccount -ArgumentList $id
              $id = $account.Translate([Security.Principal.SecurityIdentifier]).Value
            }
            if ($id -ne $identity.User.Value) { throw 'Canonical principal SID mismatch' }
            if ([int]$def.Triggers.Count -ne 1 -or [int]$def.Triggers.Item(1).Type -ne 9) { throw 'Unexpected logon trigger' }
            if ([int]$def.Actions.Count -ne 1 -or [int]$def.Actions.Item(1).Type -ne 0) { throw 'Unexpected executable action' }
            Write-Host 'Verified persisted interactive token and task principal SID'
          } finally {
            Unregister-ScheduledTask -TaskName $name -Confirm:$false -ErrorAction SilentlyContinue
          }
      - name: Verify Windows PowerShell bootstrap syntax
        shell: pwsh
        run: |
          foreach ($path in @("ue-worker/WindowsBootstrap.ps1", "ue-worker/install-v02.ps1", "ue-worker/install-v03.ps1", "ue-worker/install-v04.ps1", "ue-worker/install-v05.ps1", "ue-worker/install-v051.ps1", "ue-worker/install-v052.ps1", "ue-worker/install-signed-updater.ps1", "ue-worker/setup-signed-auto-updates-once.ps1", "ue-worker/bootstrap-vps-updater-only.ps1", "ue-worker/DirectorDesktopShare.ps1", "ue-worker/install-interactive-hero-runner.ps1")) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path).Path, [ref]$tokens, [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error "$path : $_" }
              throw "PowerShell syntax verification failed: $path"
            }
            Write-Host "Syntax OK: $path"
          }

      - name: Test native Windows PowerShell 5.1 parser and scheduler construction
        shell: powershell
        run: |
          if ($PSVersionTable.PSVersion.Major -ne 5) {
            throw "Expected inbox Windows PowerShell 5.1"
          }
          foreach ($path in @("ue-worker/setup-signed-auto-updates-once.ps1", "ue-worker/install-signed-updater.ps1", "ue-worker/install-v052.ps1", "ue-worker/bootstrap-vps-updater-only.ps1", "ue-worker/DirectorDesktopShare.ps1", "ue-worker/install-interactive-hero-runner.ps1")) {
            $tokens = $null
            $issues = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path).Path, [ref]$tokens, [ref]$issues
            ) | Out-Null
            if ($issues.Count -gt 0) {
              $issues | ForEach-Object { Write-Host ("PS5 parser error: " + $_.Message + " line " + $_.Extent.StartLineNumber) }
              throw "Windows PowerShell 5.1 parse failure: $path"
            }
          }
          # Compile the RDP native session-event handler without opening a GUI.
          $companion = Get-Content "ue-worker/DirectorDesktopShare.ps1" -Raw
          $start = "Add-Type -TypeDefinition @'"
          $end = "'@ -ReferencedAssemblies"
          $a = $companion.IndexOf($start)
          $b = $companion.IndexOf($end, $a + $start.Length)
          if ($a -lt 0 -or $b -lt 0) { throw "Missing native RDP session handler" }
          $definition = $companion.Substring($a + $start.Length, $b - $a - $start.Length).Trim()
          Add-Type -TypeDefinition $definition -ReferencedAssemblies @('System.Windows.Forms.dll','System.Drawing.dll') -ErrorAction Stop
          if (-not ('DirectorSessionForm' -as [type])) {
            throw "RDP session revocation handler failed to compile"
          }
          Write-Host "Session notification handler compiles on Windows PowerShell 5.1"
          # Compile the second native input helper as well. Do not execute input.
          $second = $companion.IndexOf($start, $b + $end.Length)
          $finish = $companion.IndexOf("'@", $second + $start.Length)
          if ($second -lt 0 -or $finish -lt 0) {
            throw "Missing native desktop input helper"
          }
          $inputDefinition = $companion.Substring(
            $second + $start.Length, $finish - $second - $start.Length
          ).Trim()
          Add-Type -TypeDefinition $inputDefinition -ErrorAction Stop
          if (-not ('DirectorDesktopInput' -as [type])) {
            throw "Native desktop input helper failed to compile"
          }
          Write-Host "Desktop input helper compiles on Windows PowerShell 5.1"
          # Build a task definition only; do not register it or touch SYSTEM.
          $args = '"C:\Program Files\Director UE\ue_signed_updater.py"'
          $action = New-ScheduledTaskAction -Execute "C:\Program Files\Python\python.exe" -Argument $args
          $trigger = New-ScheduledTaskTrigger -Once -At (Get-Date).AddMinutes(1) -RepetitionInterval (New-TimeSpan -Minutes 5) -RepetitionDuration (New-TimeSpan -Days 3650)
          $principal = New-ScheduledTaskPrincipal -UserId SYSTEM -LogonType ServiceAccount -RunLevel Highest
          $settings = New-ScheduledTaskSettingsSet -StartWhenAvailable -MultipleInstances IgnoreNew -ExecutionTimeLimit (New-TimeSpan -Minutes 4)
          $definition = New-ScheduledTask -Action $action -Trigger $trigger -Principal $principal -Settings $settings
          if (-not $definition -or $action.Arguments -ne $args) {
            throw "Scheduled task quoting/syntax regression"
          }
          Write-Host "PS 5.1 syntax, quoted paths and bounded 3650-day trigger verified"

      - name: Verify account identity matching without privileged operations
        shell: pwsh
        run: |
          . ./ue-worker/WindowsBootstrap.ps1
          $sid = "S-1-5-21-1234-2345-3456-1001"
          $cases = @(
            @{ Value = $sid; Ok = $true },
            @{ Value = "*$sid"; Ok = $true },
            @{ Value = "DirectorUEWorker"; Ok = $true },
            @{ Value = "TESTHOST\DirectorUEWorker"; Ok = $true },
            @{ Value = ".\DirectorUEWorker"; Ok = $true },
            @{ Value = "OTHERHOST\DirectorUEWorker"; Ok = $false },
            @{ Value = "Administrator"; Ok = $false },
            @{ Value = "DirectorUEWorker2"; Ok = $false },
            @{ Value = "*S-1-5-21-1234-2345-3456-1002"; Ok = $false }
          )
          foreach ($item in $cases) {
            $actual = Test-DirectorUELocalIdentity -Value $item.Value -AccountName "DirectorUEWorker" -Sid $sid -ComputerName "TESTHOST"
            if ($actual -ne $item.Ok) {
              throw "Identity matching failed for '$($item.Value)': wanted $($item.Ok), got $actual"
            }
          }
          foreach ($principal in @("DirectorUEWorker", "TESTHOST\DirectorUEWorker", $sid)) {
            if (-not (Test-DirectorUEPrincipal -Principal $principal -AccountName "DirectorUEWorker" -Sid $sid -ComputerName "TESTHOST")) {
              throw "Scheduled Task principal mismatch for '$principal'"
            }
          }
          Write-Host "Local-account and resolved-SID cases pass"
