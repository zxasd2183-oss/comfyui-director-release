name: Director Studio realtime workbench CI
on:
  push:
    branches: [main]
    paths:
      - 'studio/**'
      - '.github/workflows/ci-studio.yml'
  pull_request:
    paths:
      - 'studio/**'
      - '.github/workflows/ci-studio.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  workbench:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Microsoft identity test dependencies
        run: python -m pip install --disable-pip-version-check 'msal==1.39.0' 'PyJWT[crypto]>=2.10,<3'
      - name: Compile isolated workbench backend
        run: python -m compileall -q studio
      - name: JavaScript syntax check
        run: node --check studio/studio.js
      - name: Check safe VPS installers
        run: |
          bash -n studio/install-v08.sh
          bash -n studio/enable-jipite-domain.sh
          bash -n studio/upgrade-v09.sh
          bash -n studio/install-microsoft-web.sh
          bash -n studio/install-brain-link.sh
      - name: Offline tests - SQLite, control rights, Hub read-only, HTTP and CSRF
        run: python -m unittest discover -s studio/tests -p 'test_*.py' -v
      - name: Install browser layout test driver
        run: |
          python -m pip install --disable-pip-version-check 'playwright==1.56.0'
          if ! command -v chromium >/dev/null && ! command -v google-chrome >/dev/null; then
            python -m playwright install chromium
          fi
      - name: Browser visual layout checks (static empty states, not live production)
        run: python studio/tests/visual_layout_smoke.py --output studio-layout-shots
      - name: Save actual Chromium screenshots for design review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-v2-browser-layout-shots
          path: studio-layout-shots/
          if-no-files-found: ignore
          retention-days: 14
