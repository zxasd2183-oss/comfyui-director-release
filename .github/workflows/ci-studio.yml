name: Director Studio realtime workbench CI
on:
  push:
    branches: [main]
    paths:
      - 'studio/**'
      - 'scripts/deploy-director-all-once.sh'
      - '.github/workflows/ci-studio.yml'
  pull_request:
    paths:
      - 'studio/**'
      - 'scripts/deploy-director-all-once.sh'
      - '.github/workflows/ci-studio.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  workbench:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Microsoft identity test dependencies
        run: python -m pip install --disable-pip-version-check 'msal==1.39.0' 'PyJWT[crypto]>=2.10,<3'
      - name: Install pinned FFmpeg and FFprobe from verified wheel
        run: |
          set -euo pipefail
          # Ubuntu hosted runners do not guarantee system ffmpeg and apt DNS
          # is currently unavailable. The pinned platform wheel includes
          # BOTH executables and requires no apt or post-install download.
          python -m pip install --disable-pip-version-check 'portable-ffmpeg-full==0.5.0'
          python - <<'PY'
          import os, pathlib, subprocess
          from portable_ffmpeg import get_ffmpeg
          ffmpeg, ffprobe = get_ffmpeg()
          for path in (ffmpeg, ffprobe):
              p=pathlib.Path(path)
              assert p.is_file() and os.access(p,os.X_OK), p.name
              print(subprocess.check_output([str(p), "-version"], text=True).splitlines()[0])
          # Production code intentionally pins /usr/bin, not PATH. The
          # test runner installs verified copies ONLY into this ephemeral CI VM.
          subprocess.run(["sudo", "install", "-o", "root", "-g", "root",
                          "-m", "0755", str(ffmpeg), "/usr/bin/ffmpeg"],check=True)
          subprocess.run(["sudo", "install", "-o", "root", "-g", "root",
                          "-m", "0755", str(ffprobe), "/usr/bin/ffprobe"],check=True)
          with open(os.environ["GITHUB_PATH"],"a",encoding="utf-8") as out:
              out.write("/usr/bin\n")
          PY
      - name: Verify both actual media executables on PATH
        run: |
          set -euo pipefail
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Compile isolated workbench backend
        run: python -m compileall -q studio
      - name: JavaScript syntax check
        run: node --check studio/studio.js
      - name: Check safe VPS installers
        run: |
          bash -n studio/install-v08.sh
          bash -n studio/enable-jipite-domain.sh
          bash -n studio/upgrade-v09.sh
          bash -n studio/install-microsoft-web.sh
          bash -n studio/install-brain-link.sh
          bash -n scripts/deploy-director-all-once.sh
          bash scripts/deploy-director-all-once.sh --help >/dev/null
      - name: Offline tests - SQLite, control rights, Hub read-only, HTTP and CSRF
        run: python -m unittest discover -s studio/tests -p 'test_*.py' -v

  visual-browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser automation
        run: |
          python -m pip install --disable-pip-version-check 'playwright==1.58.0'
          # The ubuntu-24.04 GitHub image already carries Chromium system
          # libraries. --with-deps invokes apt and fails on transient Azure DNS.
          # Still download and RUN the real Playwright browser smoke below.
          python -m playwright install chromium
      - name: Exercise real Studio UI at 1440x900 and mobile
        run: python studio/tests/browser_visual_smoke.py
      - name: Keep isolated UI screenshots for visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: director-studio-visual-smoke
          path: studio/visual-smoke-output/*.png
          if-no-files-found: ignore
          retention-days: 7
