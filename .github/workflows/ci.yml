name: Validate Director V3 bootstrap

on:
  push:
    branches: [main]
    paths:
      - 'bootstrap/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify immutable bootstrap archive
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode bootstrap/director-v0.3.0-bootstrap.tar.gz.b64 > /tmp/director.tar.gz
          echo 'a4ceaf17af06c09a0ef3b18a568e6d100f196d9519701c4d31cffc104f84f204  /tmp/director.tar.gz' | sha256sum -c -
          mkdir -p extracted
          tar -xzf /tmp/director.tar.gz -C extracted --no-same-owner --no-same-permissions
      - name: Compile-check and run offline tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check cryptography
          cd extracted
          python -m compileall -q studio_mcp.py updater.py release_tools.py director_supervisor.py configure_updates.py
          python -m unittest discover -s tests -v
