name: Immediately sync signed Glacier macOS updates to VPS

on:
  push:
    branches:
      - glacier-browser-updates
    paths:
      - channels/macos-arm64.json
      - .github/workflows/glacier-macos-vps-immediate.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: glacier-macos-vps-signed-feed-trigger
  cancel-in-progress: false

jobs:
  notify-vps:
    name: Verify Ed25519 metadata, trigger restricted VPS sync, confirm HTTPS
    runs-on: ubuntu-24.04
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4

      - name: Verify offline-signed macOS update manifest
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'cryptography>=43,<47'
          python - <<'PY'
          import base64, json, re
          from pathlib import Path
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PublicKey

          def unique(pairs):
              d={}
              for k,v in pairs:
                  if k in d:raise ValueError("Duplicate signed field")
                  d[k]=v
              return d

          document=json.loads(
              Path("channels/macos-arm64.json").read_text(encoding="utf-8-sig"),
              object_pairs_hook=unique)
          expected={"channel","version","url","sha256","size","notes","key_id","signature"}
          assert set(document)==expected,"Unrecognized signed update fields"
          assert document["channel"]=="macos-arm64"
          assert document["key_id"]=="cf9452226375ff7d"
          version=document["version"]
          assert isinstance(version,str) and re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+",version)
          assert type(document["size"]) is int and 1_000_000<=document["size"]<=1_073_741_824
          assert isinstance(document["sha256"],str) and re.fullmatch(r"[0-9a-f]{64}",document["sha256"])
          assert isinstance(document["notes"],str) and len(document["notes"])<=5000
          exact=f"https://jipite.borealos.cn/glacier-updates/GlacierBrowser-v{version}-macOS-AppleSilicon.dmg"
          assert document["url"]==exact,"Untrusted update destination"
          rawsig=base64.b64decode(document["signature"],validate=True)
          assert len(rawsig)==64,"Unexpected signature size"
          body={k:v for k,v in document.items() if k!="signature"}
          serialized=json.dumps(body,sort_keys=True,ensure_ascii=False,
                                separators=(",",":"),allow_nan=False).encode("utf-8")
          pinned=bytes.fromhex("7c375bfd04b4941a662a9a66e9c3f980653cb01b9e5df286ec651eca84e26dab")
          Ed25519PublicKey.from_public_bytes(pinned).verify(rawsig,serialized)
          print("Signed manifest verified: macOS ARM64",version)
          print("Expected installer SHA256:",document["sha256"])
          PY

      - name: Start the VPS mirror immediately through restricted SSH
        env:
          GLACIER_SSH_PRIVATE: ${{ secrets.GLACIER_VPS_SSH_PRIVATE_KEY }}
          GLACIER_SSH_HOST: ${{ secrets.GLACIER_VPS_SSH_HOST }}
          GLACIER_SSH_PORT: ${{ secrets.GLACIER_VPS_SSH_PORT }}
          GLACIER_SSH_HOSTKEY: ${{ secrets.GLACIER_VPS_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          for item in GLACIER_SSH_PRIVATE GLACIER_SSH_HOST GLACIER_SSH_HOSTKEY; do
            if [[ -z "${!item:-}" ]]; then
              echo "::error::Missing repository Actions secret $item; VPS immediate sync is NOT active"
              exit 2
            fi
          done
          port="${GLACIER_SSH_PORT:-22}"
          if ! [[ "$port" =~ ^[0-9]{1,5}$ ]] || (( 10#$port < 1 || 10#$port > 65535 )); then
            echo "::error::Invalid GLACIER_VPS_SSH_PORT"
            exit 2
          fi
          dir="$(mktemp -d)"
          trap 'rm -rf "$dir"' EXIT
          chmod 0700 "$dir"
          printf '%s\n' "$GLACIER_SSH_PRIVATE" > "$dir/id_ed25519"
          printf '%s\n' "$GLACIER_SSH_HOSTKEY" > "$dir/known_hosts"
          chmod 0600 "$dir/id_ed25519" "$dir/known_hosts"
          ssh-keygen -y -f "$dir/id_ed25519" >/dev/null
          ssh -F /dev/null \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o PreferredAuthentications=publickey \
            -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$dir/known_hosts" \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=6 \
            -o NumberOfPasswordPrompts=0 \
            -i "$dir/id_ed25519" -p "$port" \
            "glaciertrigger@$GLACIER_SSH_HOST" "start-signed-glacier-sync"
          echo "VPS restricted sync command completed"

      - name: Verify current signed feed is served from VPS over HTTPS
        shell: bash
        run: |
          set -euo pipefail
          url='https://jipite.borealos.cn/glacier-updates/macos-arm64.json'
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --max-time 22 "$url" -o "$RUNNER_TEMP/glacier-live-feed.json" \
              && cmp -s channels/macos-arm64.json "$RUNNER_TEMP/glacier-live-feed.json"; then
              echo "Owner VPS is serving the exact signed manifest"
              python - <<'PY'
          import json,urllib.request
          from pathlib import Path
          doc=json.loads(Path("channels/macos-arm64.json").read_text())
          # HEAD probes availability only; the Mac app performs full DMG SHA256 verification.
          req=urllib.request.Request(doc["url"],method="HEAD")
          with urllib.request.urlopen(req,timeout=30) as r:
              assert r.status in (200,206),f"Unexpected DMG status {r.status}"
              length=r.headers.get("Content-Length")
              if length is not None:assert int(length)==doc["size"],"VPS DMG size mismatch"
              print("Signed DMG available via VPS HTTP",r.status)
          PY
              exit 0
            fi
            echo "Waiting for VPS HTTPS to publish signed macOS metadata (attempt $attempt/12)"
            sleep 10
          done
          echo "::error::VPS is not serving the newly signed update feed"
          exit 1
