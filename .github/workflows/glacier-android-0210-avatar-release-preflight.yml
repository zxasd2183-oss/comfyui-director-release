name: Glacier Android 0.2.10 avatar release safety preflight
on:
  pull_request:
    paths:
      - '.github/workflows/glacier-android-0210-avatar-verified-release.yml'
      - '.github/workflows/glacier-android-0210-avatar-release-preflight.yml'
      - 'scripts/test_glacier_android_0210_avatar_release.py'
permissions:
  contents: read
jobs:
  release-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML source validator
        run: python -m pip install 'PyYAML>=6,<7'
      - name: Verify QA source, stable signer, immutable draft gates and bash
        run: python -m unittest -v scripts.test_glacier_android_0210_avatar_release
