name: Glacier single-release integration checks (no publication)
on:
  push:
    branches:
      - integration/glacier-browser-release-candidate-20261111
    paths:
      - 'glacier-windows/**'
      - 'glacier-macos/**'
      - 'glacier-android-gecko/**'
      - 'scripts/glacier_prepare_rotated_update.py'
      - 'scripts/test_glacier_platform_versions.py'
      - 'scripts/glacier_publish_macos_signed.py'
      - 'scripts/test_glacier_macos_signed.py'
      - '.github/workflows/glacier-macos-signed-auto.yml'
      - '.github/workflows/glacier-single-release-integration.yml'
      - '.github/workflows/glacier-final-once.yml'
      - 'scripts/test_glacier_final_release_workflow.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop-source-and-ui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install system Qt graphics dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install UI test dependencies
        run: python -m pip install 'PySide6>=6.8,<7' 'cryptography>=43,<47' 'requests[socks]>=2.32,<3'
      - name: Guard independent Windows/macOS signing version gates
        run: python -m unittest -v scripts/test_glacier_platform_versions.py
      - name: Verify macOS independent signing cannot downgrade or mutate Windows
        run: |
          ln -s . source
          python -m unittest -v source/scripts/test_glacier_macos_signed.py
          rm source
      - name: Audit exact one-time three-platform publish workflow (no release)
        run: python3 -m unittest -v scripts/test_glacier_final_release_workflow.py
      - name: Compile desktop additions without publishing any build
        run: |
          python -m py_compile glacier-windows/glacier_chrome_ui30.py glacier-windows/glacier_site_diagnostic31.py glacier-windows/main.py glacier-macos/main.py
          python -m py_compile glacier-windows/glacier_accounts22.py glacier-windows/glacier_sync23.py glacier-windows/glacier_account_center26.py
      - name: Compile macOS native sources (without publishing DMG)
        run: |
          python -m py_compile glacier-macos/main.py glacier-macos/mac_platform.py glacier-macos/mac_xray_reality.py glacier-macos/mac_update_core.py glacier-macos/mac_proxy_diagnostics.py glacier-macos/mac_install.py glacier-windows/glacier_proxy_health29.py
      - name: Verify Chrome UI and original desktop shell
        working-directory: glacier-windows
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest -v test_chrome_ui30 test_site_diagnostic31 test_shell20 test_accounts22 test_account_center26 test_sync23
  android-source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check Android stable-signing readiness without using private keys
        env:
          GLACIER_ANDROID_KEYSTORE_BASE64: ${{ secrets.GLACIER_ANDROID_KEYSTORE_BASE64 }}
          GLACIER_ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.GLACIER_ANDROID_SIGNING_STORE_PASSWORD }}
          GLACIER_ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.GLACIER_ANDROID_SIGNING_KEY_PASSWORD }}
          GLACIER_ANDROID_SIGNING_KEY_ALIAS: ${{ vars.GLACIER_ANDROID_SIGNING_KEY_ALIAS }}
          GLACIER_ANDROID_CERT_SHA256: ${{ vars.GLACIER_ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          ready=1
          for name in GLACIER_ANDROID_KEYSTORE_BASE64 GLACIER_ANDROID_SIGNING_STORE_PASSWORD GLACIER_ANDROID_SIGNING_KEY_PASSWORD GLACIER_ANDROID_SIGNING_KEY_ALIAS GLACIER_ANDROID_CERT_SHA256; do
            test -n "${!name:-}" || ready=0
          done
          [[ "${GLACIER_ANDROID_CERT_SHA256:-}" =~ ^[0-9a-fA-F]{64}$ ]] || ready=0
          if [ "$ready" = 1 ]; then
            echo 'Android stable-signing configuration present; no keys printed or used.'
          else
            echo '::warning::Android stable release blocked: separate signing identity or certificate pin not provisioned.'
          fi
      - name: Verify Android RC artifact paths and versionCode before emulator startup
        run: |
          python3 glacier-android-gecko/scripts/check_rc_version_consistency.py
          python3 -m unittest discover -s glacier-android-gecko/scripts -p 'test_rc_version_consistency.py' -v
      - name: Block invalid Android stable-signature candidate configuration
        run: python3 -m unittest discover -s glacier-android-gecko/scripts -p 'test_rc_signed_release_guard.py' -v
      - name: Verify Android source is present without publishing APK
        run: |
          test -s glacier-android-gecko/app/src/main/java/cn/borealos/glacier/geckopreview/MainActivity.java
          test -s glacier-android-gecko/app/src/main/java/cn/borealos/glacier/geckopreview/BrowserUpdater.java
          test -s glacier-android-gecko/app/src/main/java/cn/borealos/glacier/geckopreview/GlacierCloudSync.java
