# Four fixed, read-only GamePilot component URLs hosted by owner's 111 VPS.
# Only published AFTER exact upstream SHA-256 verification via local proxy.
# No arbitrary URI proxying, uploads, listing or cross-tenant changes.
location = /downloads/gamepilot-components/gstreamer-1.0-1.26.11-universal.pkg {
    alias /var/lib/glacier-preview-downloads/gamepilot-components/gstreamer-1.0-1.26.11-universal.pkg;
    default_type application/octet-stream;
    autoindex off;
    disable_symlinks on;
    add_header Cache-Control "public, max-age=86400, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    limit_except GET { deny all; }
}

