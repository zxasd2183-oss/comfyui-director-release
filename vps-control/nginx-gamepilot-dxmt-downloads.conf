# Isolated, immutable GAMEPILOT FREE DXMT runtime component mirrors.
# Include ONLY inside the existing sync.borealos.cn HTTPS server via
# /etc/nginx/snippets/glacier-preview-downloads.conf.
# The Ubuntu owner installs these THREE fixed assets after independently
# verifying their SHA256 against pinned immutable GitHub releases.
# No proxy endpoints, no dynamic filenames, uploads, directory listings,
# signing operations or auth changes.
location = /downloads/gamepilot-dxmt/winecx-24.0.7_7.tar.xz {
    alias /var/lib/glacier-preview-downloads/gamepilot-dxmt/winecx-24.0.7_7.tar.xz;
    default_type application/octet-stream;
    autoindex off;
    disable_symlinks on;
    add_header Cache-Control "public, max-age=86400, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    limit_except GET { deny all; }
}
location = /downloads/gamepilot-dxmt/dxmt-0.74-builtin.tar.gz {
    alias /var/lib/glacier-preview-downloads/gamepilot-dxmt/dxmt-0.74-builtin.tar.gz;
    default_type application/octet-stream;
    autoindex off;
    disable_symlinks on;
    add_header Cache-Control "public, max-age=86400, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    limit_except GET { deny all; }
}
location = /downloads/gamepilot-dxmt/wine-stable-11.0_1-libs.tar.xz {
    alias /var/lib/glacier-preview-downloads/gamepilot-dxmt/wine-stable-11.0_1-libs.tar.xz;
    default_type application/octet-stream;
    autoindex off;
    disable_symlinks on;
    add_header Cache-Control "public, max-age=86400, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    limit_except GET { deny all; }
}
