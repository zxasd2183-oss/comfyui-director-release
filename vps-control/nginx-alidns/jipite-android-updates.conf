# Jipite public APK mirror: read-only JSON manifest and versioned signed APKs.
# Included only in the existing jipite.borealos.cn HTTPS server.
# No access to hidden temp files, lock file, or approval endpoints.
location = /app-updates/latest.json {
    alias /var/lib/jipite-updates/latest.json;
    disable_symlinks on;
    limit_except GET { deny all; }
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}
location ~ ^/app-updates/(Jipite-v[0-9]+\.[0-9]+\.[0-9]+-Microsoft-connected\.apk)$ {
    alias /var/lib/jipite-updates/$1;
    disable_symlinks on;
    limit_except GET { deny all; }
    default_type application/vnd.android.package-archive;
    add_header Cache-Control "public, max-age=3600" always;
    add_header X-Content-Type-Options "nosniff" always;
}
