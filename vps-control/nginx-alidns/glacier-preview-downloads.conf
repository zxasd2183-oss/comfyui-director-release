# Read-only Glacier preview installer mirror; sync.borealos.cn existing :8443 TLS server.
# Only these two listing endpoints and exact release filenames are public.
location = /downloads/windows-preview.json {
    alias /var/lib/glacier-preview-downloads/windows-preview.json;
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    limit_except GET HEAD { deny all; }
}
location = /downloads/macos-arm64-preview.json {
    alias /var/lib/glacier-preview-downloads/macos-arm64-preview.json;
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    limit_except GET HEAD { deny all; }
}
location ~ ^/downloads/(?<glacier_preview_file>GlacierBrowser-v[0-9]+\.[0-9]+\.[0-9]+-(?:Windows-Setup-x64\.exe|macOS-AppleSilicon\.dmg))$ {
    alias /var/lib/glacier-preview-downloads/$glacier_preview_file;
    default_type application/octet-stream;
    add_header Cache-Control "public, max-age=3600" always;
    add_header X-Content-Type-Options "nosniff" always;
    limit_except GET HEAD { deny all; }
}
