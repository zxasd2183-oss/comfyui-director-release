# Include INSIDE the existing TLS server { } for power.borealos.cn.
# ONLY the V0.3 staged-request MCP bridge on 127.0.0.1:8894,
# NEVER the raw power API on 8892 or approval web on 8893.
location ^~ /mcp/ {
    client_max_body_size 256k;
    proxy_pass http://127.0.0.1:8894;
    proxy_http_version 1.1;
    proxy_set_header Host 127.0.0.1:8894;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-Proto https;
    proxy_buffering off;
    proxy_read_timeout 90s;
}
