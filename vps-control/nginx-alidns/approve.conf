# Include INSIDE the existing TLS server { } for approve.borealos.cn.
# TWO independent approval factors: Nginx HTTP Basic Auth AND the already
# deployed 6-digit TOTP + typed human phrase. Only trusted user should
# have the Basic Auth password. This protects the secret approval URI too.
#
# To create /etc/nginx/.director-approve.htpasswd locally:
# sudo install -o root -g www-data -m 0640 /dev/null /etc/nginx/.director-approve.htpasswd
# sudo htpasswd -B /etc/nginx/.director-approve.htpasswd director-owner
# (choose a long UNIQUE password; do not send it to ChatGPT).
# Check Nginx worker group on non-Ubuntu systems before setting access.
location ^~ /approve/ {
    access_log off;  # Private secret-path URL must not enter standard access logs.
    auth_basic "Director GPU human approval";
    auth_basic_user_file /etc/nginx/.director-approve.htpasswd;
    client_max_body_size 8k;
    proxy_pass http://127.0.0.1:8893;
    proxy_http_version 1.1;
    proxy_set_header Host 127.0.0.1:8893;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-Proto https;
    proxy_buffering off;
    proxy_read_timeout 30s;
}
# Root / placeholder still works, but never route /approve/ without password.
