# ONLY include inside the existing jipite.borealos.cn HTTPS server block.
# Keep the existing 200 placeholder at / and all five Let's Encrypt certs.
# No approval WEB page. This path is consumed by the native Android app.
location ^~ /api/v1/mobile/ {
    access_log off;  # Never log Microsoft ID tokens or request identifiers.
    client_max_body_size 16k;
    proxy_pass http://127.0.0.1:8895;
    proxy_http_version 1.1;
    proxy_set_header Host 127.0.0.1:8895;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
    proxy_read_timeout 35s;
    proxy_send_timeout 35s;
    proxy_buffering off;
}
