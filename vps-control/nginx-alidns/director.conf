# Include INSIDE the existing TLS server { } for director.borealos.cn.
# DO NOT change the existing listen/ssl_certificate/80-to-443 settings.
# GPU Director V3 is forwarded from the rented GPU to VPS loopback 18790 via restricted SSH.
location ^~ /mcp/ {
    access_log off;  # Private secret-path URL must not enter standard access logs.
    client_max_body_size 256k;
    proxy_pass http://127.0.0.1:18790;
    proxy_http_version 1.1;
    proxy_set_header Host 127.0.0.1:8790;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_buffering off;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
}
# Keep existing generic / placeholder unchanged.
# Do not expose ComfyUI port 8188 or a public /health endpoint.
