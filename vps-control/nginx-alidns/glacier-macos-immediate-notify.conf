# Independent Glacier macOS GitHub OIDC trigger, in existing HTTPS server.
# Exact match outranks the existing /glacier-updates/ static 404 catch-all.
location = /glacier-updates/notify {
    limit_except POST { deny all; }
    client_max_body_size 1k;
    access_log off;
    proxy_pass http://127.0.0.1:8897/notify;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 3s;
    proxy_read_timeout 20s;
    proxy_send_timeout 20s;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}
