# Read-only Glacier macOS updates, isolated from Jipite approval endpoints.
# Included within the existing HTTPS jipite.borealos.cn server block.
location = /glacier-updates/macos-arm64.json {
    alias /var/lib/glacier-macos-updates/macos-arm64.json;
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    limit_except GET HEAD { deny all; }
}
location ~ ^/glacier-updates/(?<glacier_dmg>GlacierBrowser-v[0-9]+\.[0-9]+\.[0-9]+-macOS-AppleSilicon\.dmg)$ {
    alias /var/lib/glacier-macos-updates/$glacier_dmg;
    default_type application/x-apple-diskimage;
    add_header Cache-Control "public, max-age=86400, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    limit_except GET HEAD { deny all; }
}
# Return 404 for every other Glacier path (including hidden files).
location /glacier-updates/ {
    return 404;
}
