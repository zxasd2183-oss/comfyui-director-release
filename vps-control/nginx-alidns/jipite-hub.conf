# Include only INSIDE the existing jipite.borealos.cn TLS virtual host.
# Requires director-hub-bridge on VPS loopback port 8899.
# Leaves native Android /api/v1/mobile/ and /app-updates/ unchanged.
location ^~ /mcp/ {
    access_log off;
    client_max_body_size 256k;
    proxy_pass http://127.0.0.1:8899;
    proxy_http_version 1.1;
    proxy_set_header Host 127.0.0.1:8899;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_buffering off;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
}
