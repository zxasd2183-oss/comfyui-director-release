# GamePilot Mac signed updates — isolated read-only paths.
# Include ONLY inside the existing sync.borealos.cn HTTPS server context
# via /etc/nginx/snippets/glacier-preview-downloads.conf.
# No public upload or mutable endpoint; byte authenticity is enforced by
# GitHub Release SHA-256 and the independent GamePilot Ed25519 signature.
location = /downloads/gamepilot-macos-arm64.xml {
    alias /var/lib/glacier-preview-downloads/gamepilot-macos-arm64.xml;
    default_type application/xml;
    autoindex off;
    disable_symlinks on;
    add_header Cache-Control "no-cache, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    limit_except GET { deny all; }
}

location ~ ^/downloads/(?<gamepilot_zip>GamePilot-mac-arm64-v[0-9]+\.[0-9]+\.[0-9]+\.zip)$ {
    alias /var/lib/glacier-preview-downloads/$gamepilot_zip;
    default_type application/zip;
    autoindex off;
    disable_symlinks on;
    add_header Cache-Control "public, max-age=3600, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    limit_except GET { deny all; }
}
