[Service]
# Keep original dedicated directorstudio user, sandbox, loopback-only bind.
# systemd copies root-only source credentials into this service's private
# CREDENTIALS_DIRECTORY. Do not expose secrets in Environment or CLI args.
LoadCredential=msweb:/etc/director-studio/msweb.json
Environment=DIRECTOR_STUDIO_MICROSOFT_REQUIRED=1
ExecStart=
ExecStart=/opt/director-studio/.venv/bin/python -B /opt/director-studio/studio_server.py
