# Only the validated Microsoft Studio auth backend may protect /studio/.
# Install via install-microsoft-web.sh; never enable on its own.
# No nginx Basic Auth; the local app MUST enforce OIDC on every path.
location = /studio {
    return 308 /studio/;
}
location ^~ /studio/ {
    auth_basic off;
    client_max_body_size 12k;
    access_log off; # never log authorization-code callback query strings
    proxy_pass http://127.0.0.1:8900/;
    proxy_http_version 1.1;
    proxy_set_header Host 127.0.0.1:8900;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host jipite.borealos.cn;
    proxy_set_header X-Director-Studio-Auth-Mode microsoft;
    proxy_set_header Authorization "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}
