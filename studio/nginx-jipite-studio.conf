# Include ONLY inside the existing jipite.borealos.cn HTTPS server.
# Director Studio is an independent admin surface, not a public Jipite API.
# auth_basic is a TEMPORARY protection until Microsoft owner SSO is installed.
location = /studio {
    return 308 /studio/;
}
location ^~ /studio/ {
    auth_basic "Director Studio private operator console";
    auth_basic_user_file /etc/nginx/.director-studio-htpasswd;
    client_max_body_size 12k;
    proxy_pass http://127.0.0.1:8900/;
    proxy_http_version 1.1;
    proxy_set_header Host 127.0.0.1:8900;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host jipite.borealos.cn;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}
