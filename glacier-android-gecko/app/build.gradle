plugins {
    id 'com.android.application'
}

android {
    namespace 'cn.borealos.glacier.geckopreview'
    compileSdk 37

    defaultConfig {
        applicationId 'cn.borealos.glacier.geckopreview'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.1.1-gecko-emulator'
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

dependencies {
    // Pin the verified October 2026 stable GeckoView build, not a moving nightly.
    implementation 'org.mozilla.geckoview:geckoview:159.0.20261022150525'
}
