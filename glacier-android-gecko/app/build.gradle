plugins {
    id 'com.android.application'
}

android {
    namespace 'cn.borealos.glacier.geckopreview'
    compileSdk 37

    defaultConfig {
        applicationId 'cn.borealos.glacier.geckopreview'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '0.1.2-gecko-vless'
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging {
        jniLibs {
            useLegacyPackaging = true
            keepDebugSymbols.add('**/libsingbox.so')
        }
    }
}

dependencies {
    // Pin the verified October 2026 stable GeckoView build, not a moving nightly.
    implementation 'org.mozilla.geckoview:geckoview:159.0.20261022150525'
    testImplementation 'junit:junit:4.13.2'
}
