<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="plate" x1=".1" y1="0" x2=".95" y2="1" gradientUnits="objectBoundingBox">
