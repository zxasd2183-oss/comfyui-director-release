# Include ONLY inside the existing sync.borealos.cn TLS server on :8443.
# No server/listen/certificate directive here; existing six-domain SAN stays intact.
client_max_body_size 300k;

location = /health {
    proxy_pass http://127.0.0.1:18991/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 5s;
    proxy_read_timeout 12s;
    access_log off;
}

location /v1/ {
    proxy_pass http://127.0.0.1:18991;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Authorization $http_authorization;
    proxy_connect_timeout 5s;
    proxy_read_timeout 25s;
    proxy_request_buffering on;
    proxy_buffering off;
    add_header Cache-Control "no-store" always;
}

# Never expose a directory listing or setup files from this account origin.
location / {
    return 404;
}
