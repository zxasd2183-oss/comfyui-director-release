# Glacier Sync production hostname. First issue a TLS certificate; do not enable this snippet before the certificate exists.\n# Backend must remain localhost-only, with upstream port 18991 inaccessible from Internet.
server {
    listen 443 ssl http2;
    server_name sync.borealos.cn;

    ssl_certificate     /etc/letsencrypt/live/sync.borealos.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sync.borealos.cn/privkey.pem;
    client_max_body_size 300k;

    location / {
        proxy_pass http://127.0.0.1:18991;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
        proxy_buffering off;
    }
}
